<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>clubSENsational · Day Centre plans</title>
<link rel="icon" href="assets/logo-mark.png" />
<style>
  :root {
    --navy: #243044;
    --navy-2: #35415d;
    --ink: #1c2433;
    --muted: #5c6780;
    --line: #e3e6ee;
    --paper: #f6f4ef;
    --card: #fffcf7;
    --gold: #e4b423;
    --gold-deep: #b8860b;
    --gold-soft: #fff6dc;
    --ok: #1f7a4d;
    --ok-soft: #e7f6ee;
    --warn: #9a6200;
    --warn-soft: #fff4d8;
    --risk: #a33b45;
    --risk-soft: #fdecef;
    --info: #2d5f9a;
    --info-soft: #e8f0fa;
    --shadow: 0 18px 50px rgba(28, 36, 51, 0.08);
    --sidebar: 292px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    letter-spacing: -0.011em;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  html.solo .side { display: none; }
  html.solo .app { grid-template-columns: 1fr; }
  .side {
    background: linear-gradient(180deg, #1b2433 0%, #243044 40%, #2c3a52 100%);
    color: #f4f1ea;
    padding: 22px 16px 28px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  .brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 18px; }
  .brand img { width: 54px; height: 54px; object-fit: contain; background: #1b2433; border-radius: 14px; }
  .brand .kicker { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .brand h1 { margin: 2px 0 0; font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; color: #b7c0d0; font-size: 12px; }
  .search {
    width: 100%; border: 0; border-radius: 12px; padding: 11px 12px;
    background: rgba(255,255,255,0.08); color: white; outline: none; margin-bottom: 14px;
  }
  .search::placeholder { color: #9aa6ba; }
  .people { display: flex; flex-direction: column; gap: 8px; }
  .person {
    display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center;
    text-align: left; color: inherit; background: transparent; border: 1px solid transparent;
    border-radius: 16px; padding: 10px;
  }
  .person:hover { background: rgba(255,255,255,0.05); }
  .person.is-on { background: rgba(228,180,35,0.14); border-color: rgba(228,180,35,0.45); }
  .avatar {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
    font-weight: 750; color: #1b2433; background: var(--gold);
  }
  .person small { display: block; color: #b7c0d0; font-size: 12px; margin-top: 2px; }
  .pill {
    font-size: 10px; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 999px; padding: 4px 7px; background: rgba(255,255,255,0.1);
  }
  .pill.live { background: #1f7a4d; color: white; }
  .side-note { margin: 18px 8px 0; color: #9aa6ba; font-size: 12px; line-height: 1.45; }
  .main { min-width: 0; padding: 22px 28px 80px; }
  .eyebrow { margin: 0 0 4px; color: var(--gold-deep); font-size: 12px; font-weight: 750; letter-spacing: 0.14em; text-transform: uppercase; }
  .sheet-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  .sheet-head h2 { margin: 2px 0 0; font-size: 32px; letter-spacing: -0.04em; line-height: 1; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--line); background: white; color: var(--navy); border-radius: 999px;
    padding: 9px 14px; font-weight: 650; font-size: 13px;
  }
  .btn.primary { background: var(--navy); color: white; border-color: var(--navy); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #1b2433; }
  .btn.is-on { box-shadow: inset 0 0 0 2px var(--navy); }
  .hero {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow); padding: 18px 18px 16px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--gold-soft); color: #6d5208; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
  .chip.navy { background: #eef1f6; color: var(--navy-2); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: #f7f5f0; border-radius: 16px; padding: 12px; }
  .stat b { display: block; font-size: 22px; letter-spacing: -0.04em; }
  .stat span { color: var(--muted); font-size: 12px; }
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 16px; }
  .switch button {
    display: flex; align-items: center; gap: 12px; text-align: left;
    border-radius: 18px; border: 1px solid var(--line); background: white;
    padding: 12px 14px; box-shadow: 0 10px 28px rgba(28, 36, 51, 0.05);
  }
  .switch .pico {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none;
    background: var(--gold-soft); color: #6d5208;
  }
  .switch .pico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .switch button strong { display: block; font-size: 15px; letter-spacing: -0.02em; }
  .switch button span { color: var(--muted); font-size: 12px; }
  .switch button.is-on {
    background: linear-gradient(165deg, #31415c 0%, #1b2433 100%);
    color: white; border-color: #1b2433;
    box-shadow: 0 14px 30px rgba(27, 36, 51, 0.2);
  }
  .switch button.is-on .pico { background: rgba(228, 180, 35, 0.16); color: var(--gold); }
  .switch button.is-on span { color: #d5dbe6; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
  .toc {
    position: sticky; top: 12px; z-index: 4;
    display: flex; flex-direction: column; gap: 6px;
  }
  .toc button {
    display: flex; align-items: center; gap: 8px;
    text-align: left; border: 1px solid transparent; background: transparent; color: var(--muted);
    border-radius: 14px; padding: 7px 10px 7px 7px; font-size: 13px; font-weight: 700;
    white-space: nowrap;
  }
  .toc .tico {
    width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; flex: none;
    background: #efeae0; color: var(--navy-2);
  }
  .toc .tico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .toc button.is-on, .toc button:hover { background: white; color: var(--ink); border-color: var(--line); }
  .toc button.is-on .tico { background: var(--navy); color: var(--gold); }
  .sections { display: flex; flex-direction: column; gap: 10px; }
  details.sec {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  }
  details.sec > summary {
    list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: center;
    padding: 14px 16px; font-weight: 750;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  .mark {
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    background: var(--gold-soft); color: #6d5208; flex: none;
  }
  .mark svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sec .grow { flex: 1; }
  .sec .grow small { display: block; font-weight: 550; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--muted); transition: transform .18s ease; }
  details[open] .chev { transform: rotate(90deg); }
  .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .prose, .field { line-height: 1.5; }
  .prose p, .call p { margin: 0 0 8px; }
  .prose p:last-child, .call p:last-child { margin: 0; }
  .call { border-radius: 14px; padding: 12px 14px; background: var(--info-soft); }
  .call.warn { background: var(--warn-soft); }
  .call.risk { background: var(--risk-soft); }
  .call.ok { background: var(--ok-soft); }
  .call .label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; color: var(--navy-2); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field {
    background: #f7f5f0; border-radius: 14px; padding: 10px 12px;
  }
  .field .k { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 750; margin-bottom: 4px; }
  ul.clean { margin: 0; padding-left: 18px; }
  ul.clean li { margin: 4px 0; }
  .cards { display: grid; gap: 8px; }
  .bcard { border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: white; }
  .bcard h3 { margin: 0 0 6px; font-size: 15px; }
  .rows { display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; font-size: 14px; }
  .row b { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; padding-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--navy); color: white; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .toast {
    position: fixed; bottom: 16px; right: 16px; background: var(--navy); color: white;
    padding: 10px 14px; border-radius: 12px; display: none; z-index: 5;
  }
  body.editing [contenteditable="true"] { outline: 1px dashed rgba(184,134,11,.7); outline-offset: 2px; background: #fffdf6; border-radius: 8px; }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; }
    .side { position: relative; height: auto; }
    .main { padding: 14px 14px 64px; }
    .layout, .grid2, .stats, .row, .sheet-head, .switch { grid-template-columns: 1fr; }
    .sheet-head { flex-direction: column; align-items: stretch; }
    .tools { justify-content: flex-start; }
    .sheet-head h2 { font-size: 28px; }
    .hero { padding: 14px; border-radius: 18px; }
    .toc {
      position: sticky; top: 0;
      flex-direction: row; align-items: center;
      overflow-x: auto; overflow-y: hidden;
      gap: 8px; margin: 0 -14px 12px; padding: 8px 14px 10px;
      background: linear-gradient(180deg, var(--paper) 70%, rgba(246,244,239,0));
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .toc::-webkit-scrollbar { display: none; }
    .toc button {
      flex: 0 0 auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px 6px 6px;
      box-shadow: 0 6px 16px rgba(28, 36, 51, 0.04);
    }
    .sec .grow small { display: none; }
    .body { padding: 0 12px 14px; }
    .field, .call, .bcard { font-size: 15px; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .row b { padding-top: 0; }
  }
  @media print {
    .side, .tools, .switch, .toc, .toast { display: none !important; }
    .app { display: block; }
    details.sec { break-inside: avoid; }
    details.sec:not([open]) { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="assets/logo-white.png" alt="clubSENsational" />
      <div>
        <p class="kicker">Day Centre</p>
        <h1>Care plans</h1>
        <p>Staff only · ClubSENsational</p>
      </div>
    </div>
    <input class="search" id="q" placeholder="Find a participant" />
    <div class="people" id="people"></div>
    <p class="side-note">Edits stay in this browser. Export a JSON copy before you rely on them. This file is local and is not part of the public app.</p>

  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast">Saved on this browser</div>
<script>
const ICONS = {

  people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="2.4"/><circle cx="16" cy="9" r="2"/><path d="M4.5 18.5c.8-2.4 2.4-3.6 4.6-3.6s3.8 1.2 4.6 3.6M14 15.2c1.6-.2 3 .7 4 2.8"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3.5 19 6.2v5.4c0 4.2-2.8 7.2-7 8.9-4.2-1.7-7-4.7-7-8.9V6.2z"/></svg>',
  alert: '<svg viewBox="0 0 24 24"><path d="M12 4.2 20 18.5H4z"/><path d="M12 10v4"/><path d="M12 16.8h.01"/></svg>'

const EVIDENCE = [
  ["2026-05-15","5","Happy","Westfield for earrings, collars and rings.","Lulia"],
  ["2026-05-18","3","Upset, then calmer","Arrived very upset, possibly a driver change. Cafe, then sat outside, then a classroom day because she could not stay regulated. Calmer after about an hour.","Lulia"],
  ["2026-05-19","4","Happy and anxious","Cafe, bus, an hour on the park swing. Scared when the bus moved before she was seated. Upset at collection because she expected someone else.","Victor"],

  ["2026-06-02","—","Mostly listening","Ate lunch, put lunch away herself, accepted no, and managed floor-sitting. Still anxious in moments. Responded well to Lulia.","Michelle"],
  ["2026-06-03","—","Mixed","Happy arrival and community contact, with several dysregulation spells, floor-sitting and shoes off.","Michelle"],
  ["2026-06-05","—","Happy, one floor sit","Train to Westfield and McDonald’s for her birthday. Sat on the McDonald’s toilet floor and got up after Victor prompted.","Michelle"],
  ["2026-06-08","—","Hard start, recovered","Sat on the floor for an hour on arrival. In the gym toilet she took clothes off and later dressed. Ate with prompts.","Michelle"],

function sec(id, title, hint, icon, blocks) { return { id, title, hint, icon, blocks }; }
const NAV_SHORT = {
  personal: "Profile",
  about: "About",
  communication: "Talk",
  sensory: "Sensory",
  "personal-care": "Care",
  eating: "Food",
  health: "Health",
  mobility: "Moving",
  activities: "Activities",
  community: "Outings",
  skills: "Skills",
  relationships: "People",
  safeguarding: "Safety",
  principles: "Guide",
  regulated: "Signs",

  evidence: "Evidence",
  incidents: "Call",
  zones: "Zones",
  portal: "This year"
};
function prose(html) { return { type: "prose", html }; }
function call(kind, label, html) { return { type: "call", kind, label, html }; }
function fields(items) { return { type: "fields", items }; }
function list(items) { return { type: "list", items }; }
function cards(items) { return { type: "cards", items }; }

const ikramCare = [
  sec("about", "About Ikram", "Personality, joy, routine", "heart", [
    prose("<p>Ikram is a warm, funny woman who likes people, familiar faces, and a day she can see coming. When she is settled she jokes, asks for a hug, holds hands, and joins music, the pool, a cafe, or a slow walk. She is close to her mother, her sister, her cousins, and her cat Muchie.</p><p>She does best with the same adults, a calm room, and one clear next step. New people take time. If a preferred person is late, off, or has left, that itself can unsettle her.</p>"),
    { type: "grid", items: [
      ["What she enjoys", "Music, especially Jennifer Lopez and Ed Sheeran, and Bollywood videos. Karaoke. Swimming, with confidence growing. Slow community walks, shopping, Westfield, Portobello, cafes and restaurants. Sushi, pasta, cake, and birthday celebrations. Hair, makeup, and painted nails, often blue. Head massage, a weighted blanket, Tracey Beaker, and her iPad for music."],
      ["What is hard", "Busy noise, crowds, long waits, and an unexpected no. Leaving a place she likes. A change of driver or support worker. Unfamiliar dogs and cats, even though she loves Muchie. Long or fast walking, because of Perthes in the left hip. Heat."],
      ["What matters", "Family, Muchie, and the staff she has bonded with. A visual day plan. Compliments. Being spoken to directly and included in the choice."],
      ["A usual Club day", "Arrives about 11:00. Check-in for feelings, date, time and weather on the Club platform with Pix, then the day’s schedule. Often karaoke, snack, swimming, lunch, cooking, an outdoor choice, then the Hub to settle, a cab, and home. Swimming is planned Monday, Wednesday and Friday, 12:00 to 13:00, and is never forced."]
    ]}
  ]),
  sec("communication", "Communication", "Words, gestures, time", "chat", [
    prose("<p>Both things are true. When Ikram is regulated she uses short phrases and key words for feelings, likes and dislikes, in English and in Somali. When she is anxious, behaviour, face and body carry more of the message than speech. She does not follow complex ideas or long questions.</p>"),
    fields([
      ["Yes and no", "She can accept, refuse, and say what she wants in simple words when calm. A request for the toilet near home time may be a delay, not a toileting need. Check gently, do not argue."],
      ["Pain or discomfort", "May show as withdrawal, stopping smiling, sitting down, or distress rather than a clear ‘it hurts’. Ask one simple question and watch her hip, heat, hunger and tiredness."],
      ["Needing a break", "She sometimes says she has had enough. She may also go quiet, sit, or take shoes off."],
      ["Processing time", "One instruction. Wait. Do not stack questions."],
      ["What works", "Simple words. Show, then do. First, then. A visual schedule and a countdown. A soft voice. Compliments."],
      ["What to avoid", "Long explanations, several choices at once, a raised voice, and lots of talk while she is distressed."]
    ])
  ]),
  sec("sensory", "Sensory profile", "Sound, touch, heat, crowd", "spark", [
    fields([
      ["Sound and crowd", "Loud rooms, shopping centres and busy restaurants overwhelm her. Offer a quieter corner, headphones, or leave."],

const STORE = "club-dc-plans-v1";
const soloWho = (function(){
  const params = new URLSearchParams(location.search);
  if (params.get("solo") !== "1") return "";
  const n = String(params.get("who") || "").toLowerCase();
  if (n.indexOf("ikram") === 0) return "ikram";
  if (n.indexOf("fadi") === 0) return "fadi";
  if (n.indexOf("tim") === 0) return "timmy";
  if (n.indexOf("eman") === 0) return "emanuel";
  return "";
})();
let current = soloWho || "ikram";
if (soloWho) document.documentElement.classList.add("solo");
let plan = "care";
let editing = false;
const saved = JSON.parse(localStorage.getItem(STORE) || "{}");

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function keyOf(personId, planName, secId, path) {
  return [personId, planName, secId, path].join("|");
}
function shown(personId, planName, secId, path, fallback, html) {
  const k = keyOf(personId, planName, secId, path);
  if (Object.prototype.hasOwnProperty.call(saved, k)) return saved[k];
  return html ? fallback : esc(fallback);
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = "none"; }, 1600);
}
function person() { return PEOPLE.find(p => p.id === current); }

function renderPeople() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.getElementById("people").innerHTML = PEOPLE.filter(p => (p.name + p.aka).toLowerCase().includes(q)).map(p => `
    <button class="person ${p.id === current ? "is-on" : ""}" data-id="${p.id}">
      <span class="avatar">${esc(p.avatar)}</span>
      <span><b>${esc(p.name)}</b></span>
      <span class="pill ${p.status === "live" ? "live" : ""}">${p.status === "live" ? "Live" : "Draft"}</span>
    </button>`).join("");
}

function blockHtml(personId, planName, secId, block, index) {
  const id = `${secId}-${index}`;
  if (block.type === "prose") {
    return `<div class="prose" contenteditable="${editing}" data-k="${esc(keyOf(personId, planName, secId, id))}">${shown(personId, planName, secId, id, block.html, true)}</div>`;
  }
  if (block.type === "call") {
    return `<div class="call ${block.kind || ""}"><span class="label">${esc(block.label)}</span><div class="prose" contenteditable="${editing}" data-k="${esc(keyOf(personId, planName, secId, id))}">${shown(personId, planName, secId, id, block.html, true)}</div></div>`;
  }
  if (block.type === "fields" || block.type === "grid") {
    const cells = block.items.map((item, i) => {
      const k = keyOf(personId, planName, secId, `${id}-${i}`);
      return `<div class="field"><span class="k">${esc(item[0])}</span><div contenteditable="${editing}" data-k="${esc(k)}">${shown(personId, planName, secId, `${id}-${i}`, item[1], false)}</div></div>`;
    }).join("");
    return `<div class="${block.type === "grid" ? "grid2" : "grid2"}">${cells}</div>`;
  }
  if (block.type === "list") {
    const items = block.items.map((item, i) => `<li contenteditable="${editing}" data-k="${esc(keyOf(personId, planName, secId, `${id}-${i}`))}">${shown(personId, planName, secId, `${id}-${i}`, item, false)}</li>`).join("");
    return `<ul class="clean">${items}</ul>`;
  }
  if (block.type === "cards") {
    const labels = ["What we see", "What it may mean", "Before", "Early", "Do not", "Record"];
    return `<div class="cards">${block.items.map((card, i) => {
      const rows = card.slice(1).map((text, r) => {
        const k = keyOf(personId, planName, secId, `${id}-${i}-${r}`);
        return `<div class="row"><b>${labels[r]}</b><div contenteditable="${editing}" data-k="${esc(k)}">${shown(personId, planName, secId, `${id}-${i}-${r}`, text, false)}</div></div>`;
      }).join("");
      return `<article class="bcard"><h3>${esc(card[0])}</h3><div class="rows">${rows}</div></article>`;
    }).join("")}</div>`;
  }
  if (block.type === "table") {
    const body = block.rows.map((row, r) => `<tr>${row.map((cell, c) => `<td contenteditable="${editing}" data-k="${esc(keyOf(personId, planName, secId, `${id}-${r}-${c}`))}">${shown(personId, planName, secId, `${id}-${r}-${c}`, cell, false)}</td>`).join("")}</tr>`).join("");
    return `<table><thead><tr>${block.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
  }
  return "";
}

function render() {
  const p = person();
  const sections = plan === "care" ? p.care : p.behaviour;
  document.body.classList.toggle("editing", editing);
  renderPeople();
  document.getElementById("main").innerHTML = `
    <section class="hero">
      <div class="sheet-head">
        <div>
          <h2>${esc(p.name)}</h2>
        </div>
        <div class="tools">
          <button class="btn ${editing ? "is-on" : ""}" id="edit">${editing ? "Editing on" : "Edit"}</button>
          <button class="btn" id="save">Save</button>
          <button class="btn" id="export">Export</button>
          <button class="btn" id="reset">Reset</button>
          <button class="btn gold" id="print">Print</button>
        </div>
      </div>
      <div class="chips">${p.chips.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
      <div class="stats">${p.stats.map(s => `<div class="stat"><b>${esc(s[1])}</b><span>${esc(s[0])}</span></div>`).join("")}</div>
    </section>
    <div class="switch">
      <button class="${plan === "care" ? "is-on" : ""}" data-plan="care"><span class="pico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3.5h6l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 7 20V5A1.5 1.5 0 0 1 8.5 3.5z"/><path d="M14 3.5V8h4"/><path d="M9.5 12h5M9.5 15.5h5"/></svg></span><span><strong>Care support plan</strong><span>Profile, health, daily support</span></span></button>
      <button class="${plan === "behaviour" ? "is-on" : ""}" data-plan="behaviour"><span class="pico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5 20 7v5.2c0 4.4-3 7.4-8 9.3-5-1.9-8-4.9-8-9.3V7z"/><path d="M9 12.2 11 14.2 15.2 10"/></svg></span><span><strong>Behaviour support plan</strong><span>What we see and what we do</span></span></button>
    </div>
    <div class="layout">
      <nav class="toc">${sections.map((s, i) => `<button data-jump="${s.id}" class="${i === 0 ? "is-on" : ""}"><span class="tico">${ICONS[s.icon] || ICONS.star}</span>${esc(NAV_SHORT[s.id] || s.title)}</button>`).join("")}</nav>
      <div class="sections">${sections.map((s, i) => `
        <details class="sec" id="sec-${s.id}" ${i < 2 ? "open" : ""}>
          <summary>
            <span class="mark">${ICONS[s.icon] || ICONS.star}</span>
            <span class="grow">${esc(s.title)}<small>${esc(s.hint)}</small></span>
            <span class="chev">›</span>
          </summary>
          <div class="body">${s.blocks.map((b, bi) => blockHtml(p.id, plan, s.id, b, bi)).join("")}</div>
        </details>`).join("")}</div>
    </div>`;
  bind();
}

function bind() {
  document.querySelectorAll(".person").forEach(btn => btn.onclick = () => { current = btn.dataset.id; plan = "care"; render(); });
  document.querySelectorAll("[data-plan]").forEach(btn => btn.onclick = () => { plan = btn.dataset.plan; render(); });
  document.querySelectorAll("[data-jump]").forEach(btn => btn.onclick = () => {
    document.querySelectorAll("[data-jump]").forEach(b => b.classList.remove("is-on"));
    btn.classList.add("is-on");
    const el = document.getElementById("sec-" + btn.dataset.jump);
    el.open = true;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.getElementById("edit").onclick = () => { editing = !editing; render(); };
  document.getElementById("save").onclick = save;
  document.getElementById("export").onclick = () => {
    save();
    const blob = new Blob([JSON.stringify(saved, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "club-day-centre-plan-edits.json";
    a.click();
  };
  document.getElementById("reset").onclick = () => {
    if (!confirm("Clear edits saved in this browser and return to the original text?")) return;
    localStorage.removeItem(STORE);
    Object.keys(saved).forEach(k => delete saved[k]);
    render();
  };
  document.getElementById("print").onclick = () => {
    document.querySelectorAll("details.sec").forEach(d => d.open = true);
    setTimeout(() => window.print(), 50);
  };
}

function save() {
  document.querySelectorAll("[data-k]").forEach(el => { saved[el.dataset.k] = el.innerHTML; });
  localStorage.setItem(STORE, JSON.stringify(saved));
  toast("Saved on this browser");
}

document.getElementById("q").addEventListener("input", renderPeople);
render();
</script>
