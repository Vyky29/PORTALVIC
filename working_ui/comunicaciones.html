<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf4fb" />
  <title>Comunicaciones — clubSENsational</title>
  <link rel="icon" href="/portal/F-02-1.png" type="image/png" />
  <script src="/portal-static-bootstrap.js"></script>
  <link rel="stylesheet" href="/portal/comunicaciones/comunicaciones.css?v=20260903-comms-2" />
</head>
<body class="comms-app">
  <div id="commsBoot" class="comms-boot">
    <p>Abriendo Comunicaciones…</p>
  </div>

  <div id="commsShell" class="comms-shell" hidden>
    <aside class="comms-sidebar" id="commsSidebar">
      <header class="comms-side-head">
        <a class="comms-back-portal" id="commsBackPortal" href="staff_dashboard.html">Portal</a>
        <div class="comms-brand">
          <img src="/portal/F-02-1.png" alt="" width="36" height="36" />
          <div class="comms-brand-text">
            <strong>Comunicaciones</strong>
            <span id="commsMeName">—</span>
          </div>
        </div>
        <div class="comms-context" id="commsContextSwitch" hidden>
          <button type="button" class="comms-ctx-btn is-on" data-comms-mode="personal">Mi cuenta</button>
          <button type="button" class="comms-ctx-btn" data-comms-mode="administration">Administracion</button>
        </div>
        <label class="comms-search-wrap" id="commsSearchWrap" hidden>
          <span class="comms-sr">Buscar</span>
          <input type="search" id="commsSearch" placeholder="Buscar trabajador, grupo o mensaje…" autocomplete="off" />
        </label>
      </header>
      <div class="comms-side-body">
        <p class="comms-kicker" id="commsKickerDirect">Mis mensajes</p>
        <div id="commsListDirect" class="comms-list"></div>
        <p class="comms-kicker">Grupos</p>
        <div id="commsListGroups" class="comms-list"></div>
      </div>
      <footer class="comms-side-foot">
        <button type="button" class="comms-foot-btn" id="commsNewGroupBtn" hidden>+ Nuevo grupo</button>
        <button type="button" class="comms-foot-btn" id="commsAuditBtn" hidden>Auditoria</button>
      </footer>
    </aside>

    <section class="comms-main" id="commsMain">
      <header class="comms-chat-head" id="commsChatHead">
        <button type="button" class="comms-mob-back" id="commsMobBack" aria-label="Volver">←</button>
        <div class="comms-chat-who">
          <div class="comms-avatar" id="commsPeerAvatar" aria-hidden="true"></div>
          <div class="comms-chat-who-text">
            <h1 id="commsPeerName">Selecciona una conversacion</h1>
            <p id="commsPeerMeta" class="comms-peer-meta"></p>
          </div>
        </div>
        <div class="comms-chat-actions" id="commsChatActions" hidden>
          <button type="button" class="comms-icon-btn" id="commsCallAudio" title="Llamar" aria-label="Llamada de audio">📞</button>
          <button type="button" class="comms-icon-btn" id="commsCallVideo" title="Videollamada" aria-label="Videollamada">🎥</button>
          <button type="button" class="comms-icon-btn" id="commsGroupManage" hidden title="Participantes">👥</button>
        </div>
      </header>
      <div class="comms-thread" id="commsThread" role="log" aria-live="polite"></div>
      <p class="comms-closed-banner" id="commsClosedBanner" hidden>Este grupo esta cerrado. Puedes consultar el historial.</p>
      <form class="comms-composer" id="commsComposer" hidden>
        <input type="file" id="commsFile" hidden accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv" />
        <button type="button" class="comms-attach" id="commsAttachBtn" aria-label="Adjuntar">📎</button>
        <textarea id="commsDraft" rows="1" maxlength="4000" placeholder="Escribir…" enterkeyhint="send"></textarea>
        <button type="submit" class="comms-send" id="commsSendBtn">Enviar</button>
      </form>
    </section>
  </div>

  <div id="commsModal" class="comms-modal" hidden>
    <div class="comms-modal-backdrop" data-comms-modal-close="1"></div>
    <div class="comms-modal-card" role="dialog" aria-modal="true" id="commsModalCard"></div>
  </div>

  <div id="commsCallOverlay" class="comms-call" hidden>
    <div class="comms-call-stage">
      <video id="commsRemoteVideo" autoplay playsinline></video>
      <video id="commsLocalVideo" autoplay playsinline muted></video>
      <p class="comms-call-status" id="commsCallStatus">Llamando…</p>
      <p class="comms-call-peer" id="commsCallPeer"></p>
      <div class="comms-call-bar">
        <button type="button" id="commsMuteMic">Mic</button>
        <button type="button" id="commsMuteCam">Cam</button>
        <button type="button" class="comms-hang" id="commsHang">Colgar</button>
        <button type="button" class="comms-answer" id="commsAnswer">Aceptar</button>
        <button type="button" class="comms-reject" id="commsReject">Rechazar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/portal/comunicaciones/comunicaciones_app.js?v=20260903-comms-3"></script>
</body>
</html>
