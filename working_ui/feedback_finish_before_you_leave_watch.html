<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Finish feedback before you leave</title>
  <style>
    :root {
      --ink: #0b1220;
      --muted: #5b6473;
      --gold: #b4893a;
      --gold-line: rgba(180, 145, 90, 0.38);
      --cream: #f7f5f1;
      --bad: #b42318;
      --bad-bg: #fef3f2;
      --ok: #067647;
      --ok-bg: #ecfdf3;
      --parent: #1d4e89;
      --parent-bg: #eff6ff;
      --alert: #b45309;
      --alert-bg: #fff7ed;
    }
    * { box-sizing: border-box; }
    html.is-embed, html.is-embed body { background: transparent; }
    html.is-embed .stage { padding: 0; min-height: 100%; }
    html.is-embed .phone { height: min(680px, calc(100dvh - 8px)); box-shadow: none; }
    html, body {
      margin: 0;
      height: 100%;
      background: #ebe6dc;
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    button { font-family: inherit; }
    .stage {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 12px 16px;
      gap: 10px;
    }
    .lockbar {
      width: min(420px, 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .lockbar__copy { flex: 1; min-width: 0; }
    .lockbar__title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
    }
    .lockbar__sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .progress {
      width: min(420px, 100%);
      height: 6px;
      border-radius: 999px;
      background: rgba(11, 18, 32, 0.12);
      overflow: hidden;
      pointer-events: none;
    }
    .progress__fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #8a6a2f, #e0b45a);
    }
    .phone {
      position: relative;
      width: min(420px, 100%);
      height: min(720px, calc(100dvh - 108px));
      min-height: 0;
      background: #fff;
      border: 1px solid var(--gold-line);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(15, 20, 30, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cover {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px 22px;
      background: var(--cream);
      text-align: center;
      min-width: 0;
    }
    .cover__logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }
    .cover__kicker {
      margin: 6px 0 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .cover__title {
      margin: 0;
      max-width: 18rem;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .cover__text {
      margin: 0;
      max-width: 22rem;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .cover__play {
      appearance: none;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 800;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }
    .tap {
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 0;
      border-radius: inherit;
      background: rgba(11, 18, 32, 0.55);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .caption {
      margin: 0;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      background: #fff8e8;
      border-bottom: 1px solid var(--gold-line);
      min-height: 52px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
    }
    .caption.is-bad { background: var(--bad-bg); color: var(--bad); }
    .caption.is-good { background: var(--ok-bg); color: var(--ok); }
    .caption.is-parent { background: var(--parent-bg); color: var(--parent); }
    .sheet {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px 14px 18px;
      background: linear-gradient(180deg, #fff 0%, var(--cream) 100%);
    }
    .kicker {
      margin: 0 0 2px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .context {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
      min-width: 0;
    }
    .context span {
      font-size: 12px;
      font-weight: 700;
      color: #3f4d34;
      background: #f3f0e6;
      border: 1px solid var(--gold-line);
      border-radius: 999px;
      padding: 4px 8px;
      overflow-wrap: anywhere;
    }
    .card {
      border-radius: 16px;
      padding: 12px;
      margin: 0 0 10px;
      min-width: 0;
      border: 1px solid var(--gold-line);
      background: #fff;
    }
    .card.is-now { box-shadow: inset 0 0 0 2px rgba(6, 118, 71, 0.4); }
    .card--bad.is-now { box-shadow: inset 0 0 0 2px rgba(180, 35, 24, 0.45); }
    .card--bad {
      border-color: rgba(180, 35, 24, 0.4);
      background: var(--bad-bg);
    }
    .card--ok {
      border-color: rgba(6, 118, 71, 0.4);
      background: var(--ok-bg);
    }
    .card--alert {
      border-color: rgba(180, 83, 9, 0.4);
      background: var(--alert-bg);
    }
    .who {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .meta {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
    }
    .chip--open { background: #ffedd5; color: #9a3412; }
    .chip--await { background: #fef3c7; color: #92400e; }
    .chip--done { background: #d1fae5; color: #065f46; }
    .clock {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .clock.is-late { color: var(--bad); }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(180, 83, 9, 0.28);
      background: #fff;
      margin: 0 0 8px;
    }
    .row.is-now { box-shadow: inset 0 0 0 2px rgba(180, 83, 9, 0.45); }
    .dot {
      width: 12px;
      height: 12px;
      margin-top: 4px;
      border-radius: 999px;
      background: #f97316;
      flex: 0 0 auto;
    }
    .row strong {
      display: block;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .row span {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .parent {
      border: 1px solid #bfdbfe;
      background: var(--parent-bg);
      border-radius: 16px;
      padding: 14px;
      min-width: 0;
      margin: 0 0 10px;
    }
    .parent h2 {
      margin: 0 0 8px;
      font-size: 16px;
      color: var(--parent);
      overflow-wrap: anywhere;
    }
    .parent .who {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1e40af;
    }
    .hidden-note {
      border-radius: 14px;
      padding: 12px;
      min-width: 0;
      border: 1px dashed rgba(180, 35, 24, 0.45);
      background: #fff;
    }
    .hidden-note p {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.4;
      text-decoration: line-through;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .hidden-note small {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .ended {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .close {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      background: #d6d3d1;
      color: #78716c;
      flex: 0 0 auto;
    }
    .close:disabled { cursor: not-allowed; }
    .close.is-ready {
      background: #0b1220;
      color: #fff;
      cursor: pointer;
    }
    .replay {
      appearance: none;
      margin-top: 12px;
      border: 1px solid var(--gold-line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockbar">
      <div class="lockbar__copy">
        <p class="lockbar__title" id="lockTitle">Press play</p>
        <p class="lockbar__sub" id="lockSub">Finish feedback before you leave</p>
      </div>
      <button type="button" class="close" id="closeBtn" disabled>Close</button>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress__fill" id="progressFill"></div></div>
    <div class="phone" id="phone">
      <div class="cover" id="cover">
        <img class="cover__logo" src="/portal/F-02-1.png" width="88" height="88" alt="clubSENsational" />
        <p class="cover__kicker">Staff film</p>
        <h1 class="cover__title">Finish feedback before you leave</h1>
        <p class="cover__text">The note is the record of the day. Finish it the same day, before you leave.</p>
        <button type="button" class="cover__play" id="playBtn">Play</button>
      </div>
      <p class="caption" id="caption">Session feedback is the record of the day.</p>
      <div class="sheet" id="sheet"></div>
      <button type="button" class="tap" id="tapStart" hidden>Tap to listen</button>
    </div>
  </div>
  <script>
    (function () {
      var DURATION = 41;
      var BEATS = [
        { t: 0, tone: "good", caption: "Session feedback is the record of the day.", view: "consent" },
        { t: 2.03, tone: "good", caption: "It is a safeguarding consent, and part of the shift.", view: "consent", now: "consent" },
        { t: 5.51, tone: "good", caption: "The clear way is to finish it before you leave.", view: "shift" },
        { t: 7.92, tone: "good", caption: "Finish it the same day.", view: "shift", now: "sameday" },
        { t: 9.27, tone: "parent", caption: "The family sees Pending.", view: "parent" },
        { t: 12.50, tone: "parent", caption: "They do not see that it has not been sent.", view: "parent", now: "hidden" },
        { t: 14.46, tone: "parent", caption: "They only see that the session is still waiting.", view: "image" },
        { t: 16.84, tone: "good", caption: "It helps when they can read the day.", view: "image", now: "help" },
        { t: 18.63, tone: "parent", caption: "On your timesheet, a late note waits.", view: "timesheet" },
        { t: 20.68, tone: "good", caption: "The shift stays held. The pay is still there.", view: "timesheet", now: "held" },
        { t: 24.86, tone: "parent", caption: "It just needs admin to release it.", view: "admin" },
        { t: 26.84, tone: "good", caption: "On time, admin does not need that extra step.", view: "admin", now: "time" },
        { t: 31.08, tone: "good", caption: "The time stays with your shift.", view: "duty" },
        { t: 33.19, tone: "good", caption: "Send it before you leave.", view: "sent" },
        { t: 34.84, tone: "good", caption: "The family sees the session. Your shift counts.", view: "sent", now: "done" }
      ];

      var captionEl = document.getElementById("caption");
      var sheetEl = document.getElementById("sheet");
      var fillEl = document.getElementById("progressFill");
      var subEl = document.getElementById("lockSub");
      var titleEl = document.getElementById("lockTitle");
      var closeBtn = document.getElementById("closeBtn");
      var phoneEl = document.getElementById("phone");
      var tapEl = document.getElementById("tapStart");
      var coverEl = document.getElementById("cover");
      var playBtn = document.getElementById("playBtn");
      var audio = new Audio("/portal/help-audio/feedback-finish-before-you-leave.mp3?v=20261005h");
      audio.preload = "auto";

      var held = 0;
      var raf = 0;
      var playing = false;
      var playOrigin = 0;
      var playAnchor = 0;
      var unlocked = false;
      var lastKey = "";
      var playGen = 0;
      var started = false;

      function sessionBits() {
        return '<div class="context"><span>Alex</span><span>Aquatic</span><span>5.00-5.30</span><span>Acton</span></div>';
      }

      function consentHtml(now) {
        var card = "";
        if (now === "consent") {
          card =
            '<div class="card is-now">' +
              '<p class="who">Safeguarding consent</p>' +
              '<p class="meta">The feedback is that consent. It is part of the shift.</p>' +
            '</div>';
        }
        return '<p class="kicker">The record of the day</p><h1>Session feedback</h1>' + card;
      }

      function shiftHtml(now) {
        return (
          '<p class="kicker">End of shift</p><h1>5.30</h1>' +
          sessionBits() +
          '<div class="card is-now">' +
            '<p class="who">Finish it before you leave</p>' +
            '<p class="meta">' + (now === "sameday" ? "Same day. Before you leave." : "The clear way is to send it while the session is still fresh.") + '</p>' +
            '<span class="chip chip--open">NOT SENT YET</span>' +
          '</div>'
        );
      }

      function parentHtml(now) {
        var hidden = now === "hidden"
          ? '<div class="hidden-note"><p>Not sent yet.</p><small>The family does not see this line.</small></div>'
          : '';
        return (
          '<p class="kicker">Family portal</p>' +
          '<div class="parent">' +
            '<p class="who">Alex · Aquatic · Acton · 5.00-5.30</p>' +
            '<h2>What the family sees</h2>' +
            '<span class="chip chip--await">PENDING</span>' +
          '</div>' +
          hidden
        );
      }

      function imageHtml(now) {
        return (
          '<p class="kicker">Family portal</p><h1>Still waiting</h1>' +
          '<div class="parent">' +
            '<p class="who">What they see</p>' +
            '<h2>The session is waiting</h2>' +
            '<span class="chip chip--await">PENDING</span>' +
          '</div>' +
          '<div class="card' + (now === "help" ? " is-now card--ok" : "") + '">' +
            '<p class="who">It helps to send it</p>' +
            '<p class="meta">Then they can read the day, instead of a session that is still waiting.</p>' +
          '</div>'
        );
      }

      function timesheetHtml(now) {
        return (
          '<p class="kicker">Your timesheet</p><h1>A late note waits</h1>' +
          sessionBits() +
          '<div class="card' + (now === "held" ? " is-now" : "") + '">' +
            '<p class="who">The shift stays held</p>' +
            '<p class="meta">The pay is still there. It waits until admin releases it.</p>' +
            '<span class="chip chip--await">HELD</span>' +
          '</div>'
        );
      }

      function adminHtml(now) {
        return (
          '<p class="kicker">Admin</p><h1>One extra step</h1>' +
          '<div class="card' + (now === "time" ? "" : " is-now") + '">' +
            '<p class="who">Release</p>' +
            '<p class="meta">Admin opens the day and releases the hold.</p>' +
          '</div>' +
          '<div class="card' + (now === "time" ? " is-now card--ok" : "") + '">' +
            '<p class="who">On time, that step is not needed</p>' +
            '<p class="meta">The time stays with your shift.</p>' +
          '</div>'
        );
      }

      function dutyHtml() {
        return (
          '<p class="kicker">Your shift</p><h1>The time stays with you.</h1>' +
          '<div class="card is-now">' +
            '<p class="who">The record, the family, the timesheet</p>' +
            '<p class="meta">When the note goes in before you leave, the day is already complete.</p>' +
          '</div>'
        );
      }

      function sentHtml(now) {
        var done = now === "done"
          ? '<div class="card card--ok"><p class="who">Your shift counts</p><p class="meta">The day is complete. Admin can leave it with you.</p><span class="chip chip--done">COUNTS</span></div>'
          : '';
        return (
          '<p class="kicker">Before you leave</p><h1>Send it on time.</h1>' +
          sessionBits() +
          '<div class="card card--ok">' +
            '<p class="who">Sent before you leave</p>' +
            '<span class="chip chip--done">SENT</span>' +
          '</div>' +
          '<div class="parent">' +
            '<p class="who">Family portal</p>' +
            '<h2>What the family sees</h2>' +
            '<span class="chip chip--done">SESSION COMPLETED</span>' +
          '</div>' +
          done
        );
      }

      function endedHtml() {
        return '<p class="kicker">Done</p><h1>You can close this.</h1><p class="ended">Session feedback is the record of the day, and a safeguarding consent. The clear way is the same day, before you leave. Then the family can read the session, your shift counts, and admin does not need the extra release.</p><button type="button" class="replay" id="replayBtn">Watch again</button>';
      }

      function beatAt(t) {
        var current = BEATS[0];
        var i;
        for (i = 0; i < BEATS.length; i++) {
          if (t >= BEATS[i].t) current = BEATS[i];
        }
        return current;
      }

      function paint(t) {
        var clamped = Math.max(0, Math.min(DURATION, t));
        var beat = clamped >= DURATION ? null : beatAt(clamped);
        var key = beat ? String(beat.t) : "end";
        fillEl.style.width = ((clamped / DURATION) * 100) + "%";
        var left = Math.max(0, Math.ceil(DURATION - clamped));
        subEl.textContent = unlocked ? "You can close this" : ("0:" + (left < 10 ? "0" : "") + left + " left");
        if (key === lastKey) return;
        lastKey = key;
        captionEl.className = "caption" + (beat ? " is-" + beat.tone : " is-good");
        if (!beat) {
          captionEl.textContent = "Send it before you leave.";
          sheetEl.innerHTML = endedHtml();
          var replay = document.getElementById("replayBtn");
          if (replay) replay.addEventListener("click", replayFilm);
          unlock();
          return;
        }
        captionEl.textContent = beat.caption;
        if (beat.view === "consent") sheetEl.innerHTML = consentHtml(beat.now);
        else if (beat.view === "parent") sheetEl.innerHTML = parentHtml(beat.now);
        else if (beat.view === "image") sheetEl.innerHTML = imageHtml(beat.now);
        else if (beat.view === "timesheet") sheetEl.innerHTML = timesheetHtml(beat.now);
        else if (beat.view === "admin") sheetEl.innerHTML = adminHtml(beat.now);
        else if (beat.view === "duty") sheetEl.innerHTML = dutyHtml();
        else if (beat.view === "sent") sheetEl.innerHTML = sentHtml(beat.now);
        else sheetEl.innerHTML = shiftHtml(beat.now);
        sheetEl.scrollTop = 0;
      }

      function unlock() {
        if (unlocked) return;
        audio.pause();
        unlocked = true;
        closeBtn.disabled = false;
        closeBtn.classList.add("is-ready");
        titleEl.textContent = "Watched";
        subEl.textContent = "You can close this";
      }

      function clock() {
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
        if (!(playing && !audio.paused)) return held;
        var visual = playOrigin + (performance.now() - playAnchor) / 1000;
        if (visual < 0) visual = 0;
        var heard = audio.currentTime || 0;
        if (heard > visual + 0.35) {
          try { audio.currentTime = visual; } catch (eHear) {}
        }
        return visual;
      }

      function frame() {
        var t = clock();
        paint(t);
        if (audio.ended || t >= DURATION - 0.05) {
          playing = false;
          held = DURATION;
          paint(DURATION);
          return;
        }
        raf = requestAnimationFrame(frame);
      }

      function armPlayback() {
        playOrigin = held;
        playAnchor = performance.now();
        playing = true;
        tapEl.hidden = true;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }

      function showTap() {
        playing = false;
        tapEl.hidden = false;
        cancelAnimationFrame(raf);
      }

      function playFrom(seconds) {
        var gen = ++playGen;
        cancelAnimationFrame(raf);
        audio.pause();
        unlocked = false;
        closeBtn.disabled = true;
        closeBtn.classList.remove("is-ready");
        titleEl.textContent = "Watch to the end";
        lastKey = "";
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
        held = Math.max(0, Math.min(DURATION, seconds));
        paint(held);
        if (held >= DURATION - 0.05) {
          playing = false;
          paint(DURATION);
          return;
        }
        function go() {
          if (gen !== playGen) return;
          if (document.hidden) {
            showTap();
            return;
          }
          var launch = function () {
            if (gen !== playGen) return;
            paint(held);
            coverEl.hidden = true;
            var pending = audio.play();
            armPlayback();
            if (pending && typeof pending.then === "function") {
              pending.then(function () {
                if (gen !== playGen) {
                  audio.pause();
                  return;
                }
                if ((audio.currentTime || 0) > held + 0.35) {
                  try { audio.currentTime = held; } catch (eJump) {}
                  playOrigin = held;
                  playAnchor = performance.now();
                }
              }).catch(function () {
                if (gen === playGen) showTap();
              });
            }
          };
          if (Math.abs((audio.currentTime || 0) - held) <= 0.05) {
            launch();
            return;
          }
          var launched = false;
          var finish = function () {
            if (launched || gen !== playGen) return;
            launched = true;
            audio.removeEventListener("seeked", finish);
            launch();
          };
          audio.addEventListener("seeked", finish);
          try { audio.currentTime = held; } catch (eSeek) { finish(); return; }
          setTimeout(finish, 250);
        }
        if (audio.readyState >= 1) go();
        else audio.addEventListener("loadedmetadata", go, { once: true });
      }

      function replayFilm() {
        playFrom(0);
      }

      function pause() {
        if (!playing && audio.paused) return;
        held = audio.currentTime || held;
        playing = false;
        audio.pause();
        cancelAnimationFrame(raf);
      }

      function resume() {
        if (!started || unlocked || playing || document.hidden) return;
        var pending = audio.play();
        if (pending && typeof pending.then === "function") {
          pending.then(armPlayback).catch(showTap);
        } else {
          armPlayback();
        }
      }

      var embedWatch = false;
      try {
        embedWatch = new URLSearchParams(window.location.search).get("embed") === "1";
      } catch (eEmbed) {}
      if (embedWatch) document.documentElement.classList.add("is-embed");

      closeBtn.addEventListener("click", function () {
        if (!unlocked) return;
        audio.pause();
        var inFrame = false;
        try { inFrame = !!(window.parent && window.parent !== window); } catch (eFrame) { inFrame = true; }
        if (embedWatch && inFrame) {
          titleEl.textContent = "Watched";
          subEl.textContent = "Opening Today";
          try {
            window.parent.postMessage({ type: "portal-feedback-watch-done" }, window.location.origin);
          } catch (ePost) {}
          return;
        }
        phoneEl.hidden = true;
        titleEl.textContent = "Closed";
        subEl.textContent = "Back to Today";
        closeBtn.hidden = true;
      });

      tapEl.addEventListener("click", function () {
        if (!started) return;
        resume();
      });

      playBtn.addEventListener("click", function () {
        started = true;
        playFrom(0);
      });

      audio.addEventListener("ended", function () {
        playing = false;
        held = DURATION;
        cancelAnimationFrame(raf);
        paint(DURATION);
      });

      audio.addEventListener("loadedmetadata", function () {
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) pause();
        else resume();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !unlocked) {
          event.preventDefault();
          event.stopPropagation();
        }
      });

      window.__filmSeek = function (seconds) {
        playFrom(Number(seconds) || 0);
      };

      window.__filmStill = function (seconds) {
        playGen += 1;
        cancelAnimationFrame(raf);
        audio.pause();
        playing = false;
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
        held = Math.max(0, Math.min(DURATION, Number(seconds) || 0));
        lastKey = "";
        try { audio.currentTime = held; } catch (e) {}
        paint(held);
      };

    })();
  </script>
</body>
</html>
