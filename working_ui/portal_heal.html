<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#edf4fb" />
  <title>CS Portal - recovering</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: #edf4fb;
      color: #1e3a5f;
      font: 600 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .spin {
      width: 40px;
      height: 40px;
      border: 3px solid #c5d9ea;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; max-width: 22rem; }
    .muted { font-weight: 500; color: #5a6b7a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="spin" aria-hidden="true"></div>
    <p id="msg">Recovering CS Portal on this phone…</p>
    <p class="muted">Clearing old app cache. You will go to sign-in.</p>
  </main>
  <script>
    (function () {
      var KEEP = "clubsensational-portal-sw";
      var msg = document.getElementById("msg");
      function setMsg(t) {
        try { if (msg) msg.textContent = t; } catch (e) {}
      }
      function goLogin() {
        try {
          localStorage.setItem("portalPwaHealV12", "1");
          sessionStorage.setItem("portalPwaFreshV12", "1");
          document.cookie = "portalPwaHealV12=1; path=/; max-age=31536000; SameSite=Lax";
        } catch (e) {}
        var next = "/login.html?healed=1&t=" + Date.now();
        try {
          window.location.replace(next);
        } catch (e2) {
          window.location.href = next;
        }
      }
      var jobs = [];
      try {
        if ("caches" in window) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                (keys || []).map(function (k) {
                  return caches.delete(k);
                })
              );
            }).catch(function () {})
          );
        }
      } catch (e) {}
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                (regs || []).map(function (r) {
                  var s =
                    (r.active && r.active.scriptURL) ||
                    (r.waiting && r.waiting.scriptURL) ||
                    (r.installing && r.installing.scriptURL) ||
                    "";
                  if (String(s).indexOf(KEEP) >= 0) {
                    return r.update().catch(function () {});
                  }
                  return r.unregister().catch(function () {});
                })
              );
            }).catch(function () {})
          );
        }
      } catch (e) {}
      setMsg("Clearing cache…");
      Promise.all(jobs)
        .catch(function () {})
        .then(function () {
          setMsg("Opening sign-in…");
          setTimeout(goLogin, 250);
        });
      /* Never leave this page stuck. */
      setTimeout(goLogin, 8000);
    })();
  </script>
</body>
</html>
