<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>How we write session feedback</title>
  <style>
    :root {
      --ink: #0b1220;
      --muted: #5b6473;
      --gold: #b4893a;
      --gold-line: rgba(180, 145, 90, 0.38);
      --cream: #f7f5f1;
      --field: #f9f7f3;
      --bad: #b42318;
      --bad-bg: #fef3f2;
      --ok: #067647;
      --ok-bg: #ecfdf3;
      --parent: #1d4e89;
      --parent-bg: #eff6ff;
    }
    * { box-sizing: border-box; }
    html.is-embed, html.is-embed body { background: transparent; }
    html.is-embed .stage { padding: 0; min-height: 100%; }
    html.is-embed .phone { height: min(680px, calc(100dvh - 8px)); box-shadow: none; }
    html, body {
      margin: 0;
      height: 100%;
      background: #ebe6dc;
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    button, textarea { font-family: inherit; }
    .stage {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 12px 16px;
      gap: 10px;
    }
    .lockbar {
      width: min(420px, 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .lockbar__copy {
      flex: 1;
      min-width: 0;
    }
    .lockbar__title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .lockbar__sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .progress {
      width: min(420px, 100%);
      height: 6px;
      border-radius: 999px;
      background: rgba(11, 18, 32, 0.12);
      overflow: hidden;
      pointer-events: none;
    }
    .progress__fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #8a6a2f, #e0b45a);
    }
    .phone {
      position: relative;
      width: min(420px, 100%);
      height: min(720px, calc(100dvh - 108px));
      min-height: 0;
      background: #fff;
      border: 1px solid var(--gold-line);
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(15, 20, 30, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cover {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px 22px;
      background: var(--cream);
      text-align: center;
      min-width: 0;
    }
    .cover__logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }
    .cover__kicker {
      margin: 6px 0 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .cover__title {
      margin: 0;
      max-width: 18rem;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .cover__text {
      margin: 0;
      max-width: 22rem;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .cover__play {
      appearance: none;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 800;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }
    .tap {
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 0;
      border-radius: inherit;
      background: rgba(11, 18, 32, 0.55);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .caption {
      margin: 0;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.01em;
      background: #fff8e8;
      border-bottom: 1px solid var(--gold-line);
      min-height: 52px;
      display: flex;
      align-items: center;
      overflow-wrap: anywhere;
    }
    .caption.is-bad { background: var(--bad-bg); color: var(--bad); }
    .caption.is-good { background: var(--ok-bg); color: var(--ok); }
    .caption.is-parent { background: var(--parent-bg); color: var(--parent); }
    .sheet {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px 14px 18px;
      background: linear-gradient(180deg, #fff 0%, var(--cream) 100%);
    }
    .kicker {
      margin: 0 0 2px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .context {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 12px;
      min-width: 0;
    }
    .context span {
      font-size: 12px;
      font-weight: 700;
      color: #3f4d34;
      background: #f3f0e6;
      border: 1px solid var(--gold-line);
      border-radius: 999px;
      padding: 4px 8px;
      overflow-wrap: anywhere;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      min-width: 0;
    }
    .field {
      border: 1px solid var(--gold-line);
      border-radius: 14px;
      padding: 10px;
      background: var(--field);
      margin: 0 0 10px;
      min-width: 0;
    }
    .field__label {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 800;
    }
    .stars {
      display: flex;
      gap: 6px;
    }
    .star {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--gold-line);
      background: #fff;
      color: #d6d3d1;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
    }
    .star.is-on {
      color: #a16207;
      border-color: rgba(234, 179, 8, 0.7);
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.25);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--gold-line);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .pill.is-on {
      color: var(--ink);
      border-color: rgba(234, 179, 8, 0.7);
      box-shadow: inset 0 0 0 1px rgba(253, 224, 71, 0.5);
    }
    .narrative {
      margin: 0;
      min-height: 92px;
      border-radius: 12px;
      border: 1px solid rgba(180, 145, 90, 0.28);
      background: #fff;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .narrative.is-bad {
      border-color: rgba(180, 35, 24, 0.45);
      background: #fff8f7;
    }
    .narrative.is-good {
      border-color: rgba(6, 118, 71, 0.4);
      background: #f6fef9;
    }
    .narrative .tag {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 8px;
    }
    .narrative .tag:first-child { margin-top: 0; }
    .narrative .ghost { color: #a8a29e; }
    .slot {
      border-radius: 14px;
      padding: 10px 12px;
      margin: 0 0 10px;
      min-width: 0;
      border: 1px solid var(--gold-line);
      background: #fff;
    }
    .slot__label {
      margin: 0 0 2px;
      font-size: 13px;
      font-weight: 800;
    }
    .slot__sub {
      margin: 0 0 6px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .slot p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .slot--mix {
      border-color: rgba(180, 35, 24, 0.45);
      background: #fff8f7;
    }
    .slot--mix .slot__label,
    .slot--mix .slot__sub { color: var(--bad); }
    .slot--celebrate {
      border-color: rgba(6, 118, 71, 0.4);
      background: #f6fef9;
    }
    .slot--celebrate .slot__label { color: var(--ok); }
    .slot--relevant {
      border-color: rgba(180, 145, 90, 0.55);
      background: #fffaf0;
    }
    .slot--relevant .slot__label { color: #8a5a12; }
    .slot.is-dim { opacity: 0.45; }
    .slot.is-now { box-shadow: inset 0 0 0 2px rgba(138, 90, 18, 0.45); }
    .slot--celebrate.is-now { box-shadow: inset 0 0 0 2px rgba(6, 118, 71, 0.45); }
    .slot .ghost { color: #a8a29e; }
    .checks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .checks li {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid transparent;
      min-width: 0;
    }
    .mark {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      background: #e7e5e4;
      color: #78716c;
    }
    .checks strong {
      font-size: 13px;
    }
    .checks em {
      font-style: normal;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .checks em::before { content: " - "; }
    .checks li.is-miss {
      background: var(--bad-bg);
      border-color: rgba(180, 35, 24, 0.25);
    }
    .checks li.is-miss .mark { background: var(--bad); color: #fff; }
    .checks li.is-miss em { color: var(--bad); font-weight: 700; }
    .checks li.is-ok {
      background: var(--ok-bg);
      border-color: rgba(6, 118, 71, 0.25);
    }
    .checks li.is-ok .mark { background: var(--ok); color: #fff; }
    .checks li.is-now {
      box-shadow: inset 0 0 0 2px rgba(6, 118, 71, 0.35);
    }
    .parent {
      border: 1px solid #bfdbfe;
      background: var(--parent-bg);
      border-radius: 16px;
      padding: 14px;
      min-width: 0;
    }
    .parent h2 {
      margin: 0 0 6px;
      font-size: 16px;
      color: var(--parent);
    }
    .parent p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .parent .who {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1e40af;
    }
    .close {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      background: #d6d3d1;
      color: #78716c;
      flex: 0 0 auto;
    }
    .close:disabled { cursor: not-allowed; }
    .close.is-ready {
      background: #0b1220;
      color: #fff;
      cursor: pointer;
    }
    .ended {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }
    .replay {
      appearance: none;
      margin-top: 12px;
      border: 1px solid var(--gold-line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockbar">
      <div class="lockbar__copy">
        <p class="lockbar__title" id="lockTitle">Press play</p>
        <p class="lockbar__sub" id="lockSub">How we write session feedback</p>
      </div>
      <button type="button" class="close" id="closeBtn" disabled>Close</button>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress__fill" id="progressFill"></div></div>
    <div class="phone" id="phone">
      <div class="cover" id="cover">
        <img class="cover__logo" src="/portal/F-02-1.png" width="88" height="88" alt="clubSENsational" />
        <p class="cover__kicker">Staff film</p>
        <h1 class="cover__title">How we write session feedback</h1>
        <p class="cover__text">Feedback is the session. Relevant information is a different box.</p>
        <button type="button" class="cover__play" id="playBtn">Play</button>
      </div>
      <p class="caption" id="caption">Feedback is the session.</p>
      <div class="sheet" id="sheet"></div>
      <button type="button" class="tap" id="tapStart" hidden>Tap to listen</button>
    </div>
  </div>
  <script>
    (function () {
      var DURATION = 30;
      var SESSION = "He swam four lengths of backstroke kick and finished proud. He needed prompts to keep his legs straight and got tired, so the set ended early.";
      var RELEVANT = "Dad was angry about the changing room. They asked to change next week's booking.";
      var BEATS = [
        { t: 0, tone: "good", caption: "Feedback is the session.", view: "session" },
        { t: 1.60, tone: "good", caption: "What they did, what went well, and what was hard.", view: "session" },
        { t: 5.43, tone: "good", caption: "Prompts stay in Feedback.", view: "session", now: "feedback" },
        { t: 8.44, tone: "good", caption: "Getting tired and finishing early stays in Feedback too.", view: "session", now: "feedback" },
        { t: 12.53, tone: "neutral", caption: "Relevant information is a different box.", view: "split" },
        { t: 15.31, tone: "neutral", caption: "It is not the session.", view: "split" },
        { t: 16.85, tone: "good", caption: "A booking goes there.", view: "split", now: "relevant" },
        { t: 18.29, tone: "good", caption: "A parent angry about the changing room goes there too.", view: "split", now: "relevant" },
        { t: 21.57, tone: "parent", caption: "The family only reads Feedback.", view: "parent" },
        { t: 23.48, tone: "parent", caption: "Relevant information stays with the office.", view: "parent" },
        { t: 26.12, tone: "good", caption: "The family reads the session. The office keeps the other note.", view: "parent" }
      ];

      var captionEl = document.getElementById("caption");
      var sheetEl = document.getElementById("sheet");
      var fillEl = document.getElementById("progressFill");
      var subEl = document.getElementById("lockSub");
      var titleEl = document.getElementById("lockTitle");
      var closeBtn = document.getElementById("closeBtn");
      var phoneEl = document.getElementById("phone");

      var tapEl = document.getElementById("tapStart");
      var coverEl = document.getElementById("cover");
      var playBtn = document.getElementById("playBtn");
      var audio = new Audio("/portal/help-audio/feedback-session-vs-relevant.mp3?v=20261005f");
      audio.preload = "auto";

      var held = 0;
      var raf = 0;
      var playing = false;
      var unlocked = false;
      var lastKey = "";
      var wantsPlay = false;
      var playGen = 0;
      var started = false;

      function slot(kind, title, sub, body, extra) {
        return (
          '<div class="slot slot--' + kind + (extra ? " " + extra : "") + '">' +
          '<div class="slot__label">' + title + '</div>' +
          '<div class="slot__sub">' + sub + '</div>' +
          '<p>' + body + '</p></div>'
        );
      }

      function head() {
        return '<p class="kicker">Example</p><h1>Session feedback</h1>' +
          '<div class="context"><span>Alex</span><span>Aquatic</span><span>5.00-5.30</span><span>Acton</span></div>';
      }

      function formHtml(beat) {
        var feedbackExtra = beat.now === "feedback" ? "is-now" : "";
        if (beat.view === "session") {
          return head() + slot("celebrate", "Feedback", "The session. What they did, what went well, and what was hard.", SESSION, feedbackExtra);
        }
        var relExtra = beat.now === "relevant" ? "is-now" : "";
        var relevantBody = beat.now === "relevant" ? RELEVANT : '<span class="ghost">Not written yet.</span>';
        var relevantSub = beat.now === "relevant"
          ? "A booking, or a parent angry about the changing room."
          : "A different box. Not the session.";
        return head() +
          slot("celebrate", "Feedback", "The session. What they did, what went well, and what was hard.", SESSION) +
          slot("relevant", "Relevant information", relevantSub, relevantBody, relExtra);
      }

      function parentHtml() {
        return (
          '<p class="kicker">Family app</p>' +
          '<div class="parent"><p class="who">Session note · Alex</p><h2>What the family reads</h2><p>' + SESSION + '</p></div>' +
          slot("relevant", "Relevant information", "Stays with the office, so the family can read the session.", RELEVANT, "is-dim")
        );
      }

      function endedHtml() {
        return '<p class="kicker">Done</p><h1>You can close this.</h1><p class="ended">Feedback is the session, including prompts and finishing early. Relevant information is a different box: a booking, or a parent angry about the changing room. The family only reads Feedback.</p><button type="button" class="replay" id="replayBtn">Watch again</button>';
      }

      function beatAt(t) {
        var current = BEATS[0];
        var i;
        for (i = 0; i < BEATS.length; i++) {
          if (t >= BEATS[i].t) current = BEATS[i];
        }
        return current;
      }

      function paint(t) {
        var clamped = Math.max(0, Math.min(DURATION, t));
        var beat = clamped >= DURATION ? null : beatAt(clamped);
        var key = beat ? String(beat.t) : "end";
        fillEl.style.width = ((clamped / DURATION) * 100) + "%";
        var left = Math.max(0, Math.ceil(DURATION - clamped));
        subEl.textContent = unlocked ? "You can close this" : ("0:" + (left < 10 ? "0" : "") + left + " left");
        if (key === lastKey) return;
        lastKey = key;
        captionEl.className = "caption" + (beat ? " is-" + beat.tone : " is-good");
        if (!beat) {
          captionEl.textContent = "The family reads the session.";
          sheetEl.innerHTML = endedHtml();
          var replay = document.getElementById("replayBtn");
          if (replay) replay.addEventListener("click", replayFilm);
          unlock();
          return;
        }
        captionEl.textContent = beat.caption;
        sheetEl.innerHTML = beat.view === "parent" ? parentHtml() : formHtml(beat);
        var focus = sheetEl.querySelector(".is-now") || sheetEl.querySelector(".is-miss") || sheetEl.querySelector(".parent");
        if (focus) {
          var sheetRect = sheetEl.getBoundingClientRect();
          var focusRect = focus.getBoundingClientRect();
          if (focusRect.bottom > sheetRect.bottom - 8) {
            sheetEl.scrollTop += focusRect.bottom - sheetRect.bottom + 12;
          }
        } else {
          sheetEl.scrollTop = 0;
        }
      }

      function unlock() {
        if (unlocked) return;
        audio.pause();
        unlocked = true;
        closeBtn.disabled = false;
        closeBtn.classList.add("is-ready");
        closeBtn.textContent = "Close";
        titleEl.textContent = "Watched";
        subEl.textContent = "You can close this";
      }

      function clock() {
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
        if (playing && !audio.paused) return audio.currentTime || 0;
        return held;
      }

      function frame() {
        var t = clock();
        paint(t);
        if (audio.ended || t >= DURATION - 0.05) {
          playing = false;
          held = DURATION;
          paint(DURATION);
          return;
        }
        raf = requestAnimationFrame(frame);
      }

      function armPlayback() {
        playing = true;
        wantsPlay = false;
        tapEl.hidden = true;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }

      function showTap() {
        playing = false;
        wantsPlay = true;
        tapEl.hidden = false;
        cancelAnimationFrame(raf);
      }

      function playFrom(seconds) {
        var gen = ++playGen;
        cancelAnimationFrame(raf);
        audio.pause();
        unlocked = false;
        closeBtn.disabled = true;
        closeBtn.classList.remove("is-ready");
        closeBtn.textContent = "Close";
        titleEl.textContent = "Watch to the end";
        lastKey = "";
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
        held = Math.max(0, Math.min(DURATION, seconds));
        paint(held);
        if (held >= DURATION - 0.05) {
          playing = false;
          paint(DURATION);
          return;
        }
        function go() {
          if (gen !== playGen) return;
          try { audio.currentTime = held; } catch (e) {}
          if (document.hidden) {
            showTap();
            return;
          }
          var pending = audio.play();
          if (pending && typeof pending.then === "function") {
            pending.then(function () {
              if (gen !== playGen) {
                audio.pause();
                return;
              }
              armPlayback();
            }).catch(function () {
              if (gen === playGen) showTap();
            });
          } else if (gen === playGen) {
            armPlayback();
          }
        }
        if (audio.readyState >= 1) go();
        else audio.addEventListener("loadedmetadata", go, { once: true });
      }

      function replayFilm() {
        playFrom(0);
      }

      function pause() {
        if (!playing && audio.paused) return;
        held = audio.currentTime || held;
        playing = false;
        wantsPlay = true;
        audio.pause();
        cancelAnimationFrame(raf);
      }

      function resume() {
        if (!started || unlocked || playing || document.hidden) return;
        var pending = audio.play();
        if (pending && typeof pending.then === "function") {
          pending.then(armPlayback).catch(showTap);
        } else {
          armPlayback();
        }
      }

      var embedWatch = false;
      try {
        embedWatch = new URLSearchParams(window.location.search).get("embed") === "1";
      } catch (eEmbed) {}
      if (embedWatch) document.documentElement.classList.add("is-embed");

      closeBtn.addEventListener("click", function () {
        if (!unlocked) return;
        audio.pause();
        var inFrame = false;
        try { inFrame = !!(window.parent && window.parent !== window); } catch (eFrame) { inFrame = true; }
        if (embedWatch && inFrame) {
          titleEl.textContent = "Watched";
          subEl.textContent = "Opening Today";
          try {
            window.parent.postMessage({ type: "portal-feedback-watch-done" }, window.location.origin);
          } catch (ePost) {}
          return;
        }
        phoneEl.hidden = true;
        titleEl.textContent = "Closed";
        subEl.textContent = "Back to Today";
        closeBtn.hidden = true;
      });

      tapEl.addEventListener("click", function () {
        if (!started) return;
        resume();
      });

      playBtn.addEventListener("click", function () {
        started = true;
        coverEl.hidden = true;
        playFrom(0);
      });

      audio.addEventListener("ended", function () {
        playing = false;
        held = DURATION;
        cancelAnimationFrame(raf);
        paint(DURATION);
      });

      audio.addEventListener("loadedmetadata", function () {
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) pause();
        else resume();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !unlocked) {
          event.preventDefault();
          event.stopPropagation();
        }
      });

      window.__filmSeek = function (seconds) {
        playFrom(Number(seconds) || 0);
      };

      window.__filmStill = function (seconds) {
        playGen += 1;
        cancelAnimationFrame(raf);
        audio.pause();
        playing = false;
        if (audio.duration && isFinite(audio.duration)) DURATION = audio.duration;
        held = Math.max(0, Math.min(DURATION, Number(seconds) || 0));
        lastKey = "";
        try { audio.currentTime = held; } catch (e) {}
        paint(held);
      };

    })();
  </script>
</body>
</html>
