<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El mundo de los portales</title>
  <script>
    (function () {
      var h = location.hostname;
      if (h !== "localhost" && h !== "127.0.0.1") {
        document.documentElement.classList.add("portal-world-locked");
      }
    })();
  </script>
  <style>
    :root { --ink: #e7f2fb; --gold: #f4b740; --sea-0: #07111c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--sea-0); }
    html.portal-world-locked .app { visibility: hidden; }
    .lock { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #e8f4fb; font-weight: 650; background: var(--sea-0); }
    html.portal-world-locked .lock { display: flex; }
    .app { height: 100%; min-height: 0; display: flex; flex-direction: column; }
    header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 12px; color: #e7f3fa; min-width: 0; }
    .pw-legend { flex: 1 1 100%; }
    header.top h1 { margin: 0; font-size: 16px; white-space: nowrap; }
    header.top p { display: none; }
    #pwStories { display: none; }
    .pw-bars { display: flex; gap: 6px; overflow-x: auto; min-width: 0; }
    .pw-bars button, .pw-tools button, .pw-controls button, .pw-storypicks button, #pwSim, #pwBack {
      font: inherit; cursor: pointer; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #f4fbff; border-radius: 999px; padding: 6px 10px; font-weight: 700; font-size: 13px;
    }
    .pw-bars button.is-on { background: var(--gold); color: #3a2a08; border-color: var(--gold); }
    .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .pw-viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; background-color: #071422; background-image: radial-gradient(rgba(180,210,230,.35) 1.15px, transparent 1.25px); background-size: 22px 22px; }
    .pw-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #pwWires { position: absolute; inset: 0; overflow: visible; }
    #pwWires path { fill: none; stroke-width: 2.2; stroke-linecap: round; opacity: .9; }
    #pwWires path.is-dim { stroke-opacity: .12; opacity: .35; }
    #pwWires path.is-hot { stroke-width: 3.4; }
    #pwWires path.is-reply { stroke-dasharray: 7 8; animation: pw-dash 1.1s linear infinite; }
    @keyframes pw-dash { to { stroke-dashoffset: -30; } }
    .pw-frame {
      position: absolute; border-radius: 16px; z-index: 2; min-width: 0;
      background: rgba(8, 16, 28, .88); color: #e7f2fb;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
    }
    .pw-frame h2 { margin: 12px 14px 0; font-size: 15px; font-weight: 750; }
    .pw-kicker { display: block; margin: 10px 14px 0; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .62; }
    .pw-world[data-detail="worlds"] .pw-fn,
    .pw-world[data-detail="worlds"] .pw-kicker { display: none; }
    .pw-fn {
      position: absolute; height: 36px; border-radius: 9px; z-index: 3;
      border: 1px solid rgba(255,255,255,.16); background: rgba(16, 28, 44, .95); color: #f4fbff;
      font: 700 13px/36px "Segoe UI", system-ui, sans-serif; text-align: left; padding: 0 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .pw-frame.is-lit { opacity: 1; z-index: 3; box-shadow: 0 0 0 2px var(--lit, #f4b740), 0 0 28px var(--lit, #f4b740); }
    .pw-frame.is-dim, .pw-fn.is-dim { opacity: 0.2; }
    .pw-fn.is-lit, .pw-fn.is-hot { border-color: var(--gold); box-shadow: 0 0 14px var(--gold); background: rgba(244,183,64,.16); }
    #pwWires path.is-hot { stroke-width: 5; filter: drop-shadow(0 0 5px currentColor); }
    .pw-frame.island--booking { box-shadow: inset 0 0 0 1px rgba(226,184,106,.55); }
    .pw-frame.island--admin { box-shadow: inset 0 0 0 1px rgba(31,143,126,.7); }
    .pw-frame.island--staff { box-shadow: inset 0 0 0 1px rgba(63,126,191,.7); }
    .pw-frame.island--auto { box-shadow: inset 0 0 0 1px rgba(226,163,34,.7); }
    .pw-frame.island--parent { box-shadow: inset 0 0 0 1px rgba(231,162,148,.7); }
    .pw-frame.island--comms { box-shadow: inset 0 0 0 1px rgba(142,160,190,.7); }
    .pw-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(7,20,34,.85); pointer-events: none; z-index: 4; }
    .pw-dot.is-reply { animation: pw-blink 0.7s ease-in-out infinite; }
    @keyframes pw-blink { 50% { opacity: .2; } }
    .pw-tools { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; gap: 6px; align-items: center; }
    .pw-legend { display: flex; flex-wrap: wrap; gap: 8px 12px; color: #d5e6f2; font-size: 12px; min-width: 0; }
    .pw-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .pw-legend i.pw-blink { animation: pw-blink 0.7s ease-in-out infinite; }
    .pw-mini { position: absolute; right: 12px; bottom: 12px; z-index: 5; width: 168px; height: 96px; border-radius: 10px; border: 1px solid rgba(255,255,255,.28); background: #071422; cursor: pointer; }
    #pwSim { margin-left: 0; background: #f4fbff; color: #102033; border: 0; }
    #pwBack { position: absolute; left: 12px; top: 12px; z-index: 6; background: #f4fbff; color: #102033; }
    #pwFlow { display: none !important; }
    #pwSub[hidden] { display: none !important; }
    #pwSub {
      position: absolute; inset: 0; z-index: 4; overflow: hidden;
      background-color: #071422;
      background-image: radial-gradient(rgba(180,210,230,.35) 1.15px, transparent 1.25px);
      background-size: 22px 22px;
    }
    #pwSubCanvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .pw-sub-kicker { position: absolute; left: 118px; top: 16px; margin: 0; z-index: 5; font-weight: 750; pointer-events: none; }
    .pw-sub-svg { position: absolute; left: 0; top: 0; overflow: visible; z-index: 2; }
    .pw-sub-svg path { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: .55; }
    .pw-sub-svg path.is-hot { stroke-width: 3.4; opacity: 1; }
    .pw-sub-svg text { fill: #d5e6f2; font: 700 12px "Segoe UI", system-ui, sans-serif; }
    .pw-sub-node {
      position: absolute; z-index: 3; min-height: 64px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22);
      background: rgba(8, 18, 32, .94); color: #f4fbff; text-align: left; padding: 10px 12px; cursor: pointer;
    }
    .pw-sub-node b, .pw-sub-node span { display: block; min-width: 0; overflow-wrap: anywhere; }
    .pw-sub-node b { font-size: 14px; }
    .pw-sub-node span { margin-top: 3px; font-size: 12px; color: #9fb4c6; font-weight: 650; }
    .pw-sub-node.is-now { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(244,183,64,.45); background: rgba(244,183,64,.12); }
    aside.panel {
      display: none; flex: 0 0 auto; z-index: 7; max-height: 32vh; margin: 0 12px 12px; overflow: auto;
      background: #101a28; color: #e7f2fb; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px 14px 14px;
    }
    .pw-from { margin: 0 0 8px; font-weight: 750; color: #f4fbff; overflow-wrap: anywhere; }
    aside.panel.is-open { display: block; }
    aside.panel.is-slim { max-height: 132px; }
    aside.panel.is-slim h2 { font-size: 16px; }
    aside.panel.is-slim .pw-from, aside.panel.is-slim p { margin: 2px 0; }
    aside.panel h2 { margin: 0 0 4px; font-size: 18px; }
    aside.panel h3 { margin: 12px 0 4px; font-size: 13px; }
    .pw-sub, .pw-fx, .pw-gate { margin: 4px 0; color: #b7c9d8; font-size: 13px; overflow-wrap: anywhere; }
    .pw-gate { color: #f4b740; font-weight: 700; }
    .pw-now, .pw-card, .pw-guide { margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); overflow-wrap: anywhere; }
    .pw-steps { margin: 8px 0 0; padding-left: 18px; }
    .pw-steps li { margin: 6px 0; cursor: pointer; overflow-wrap: anywhere; }
    .pw-steps li.is-now { background: rgba(244,183,64,.22); border-radius: 8px; }
    .pw-controls, .pw-storypicks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pw-panel-x { float: right; }
    @media (prefers-reduced-motion: reduce) {
      #pwWires path.is-reply, .pw-dot.is-reply, .pw-legend i.pw-blink { animation: none; }
    }
  </style>
</head>
<body>
  <div class="lock">Comprobando la sesion de oficina...</div>
  <div class="app">
    <header class="top">
      <h1>El mundo de los portales</h1>
      <div class="pw-bars" id="pwWorlds" role="tablist" aria-label="Mundos"></div>
      <div class="pw-legend" id="pwLegend"></div>
      <div id="pwStories" hidden></div>
    </header>
    <div class="stage">
      <div class="pw-viewport" id="pwViewport">
        <button type="button" id="pwBack" hidden>Mundos</button>
        <div class="pw-world" id="pwWorld" data-detail="worlds">
          <svg id="pwWires" viewBox="0 0 2800 2100" aria-hidden="true">
            <defs>
              <marker id="pwArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="#f4b740"></path>
              </marker>
            </defs>
            <g id="pwPaths"></g>
          </svg>
        <div id="pwNodes"></div>
        <div id="pwParticles"></div>
        </div>
        <div id="pwSub" hidden></div>
        <div id="pwFlow" hidden></div>
        <div class="pw-tools">
          <button type="button" id="pwZoomOut" aria-label="Alejar">-</button>
          <button type="button" id="pwZoomIn" aria-label="Acercar">+</button>
          <button type="button" id="pwFit">Ver todo</button>
          <button type="button" id="pwSim">Pausar movimiento</button>
          <span id="pwZoomLabel"></span>
        </div>
        <canvas class="pw-mini" id="pwMini" width="168" height="120" aria-label="Minimapa"></canvas>
      </div>
      <aside class="panel" id="pwPanel" aria-live="polite"></aside>
    </div>
  </div>
  <script src="/portal/portal_world_data.js?v=20261005-world-sub"></script>
  <script src="/portal/portal_world_canvas.js?v=20261005-world-sub"></script>
  <script>
    if (window.PortalWorldCanvasBoot) window.PortalWorldCanvasBoot(document);
  </script>
  <script type="module">
    var host = location.hostname;
    if (host === "localhost" || host === "127.0.0.1") {
      document.documentElement.classList.add("portal-world-ready");
    } else {
      document.documentElement.classList.add("portal-world-locked");
      try {
        var auth = await import("/portal/auth-handler.js?v=20261003-world");
        await auth.bootstrapDashboardSupabase({ page: "admin" });
        document.documentElement.classList.remove("portal-world-locked");
        document.documentElement.classList.add("portal-world-ready");
      } catch (err) {
        location.replace("/login.html");
      }
    }
  </script>
</body>
</html>
