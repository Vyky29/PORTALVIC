<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>El mundo de los portales</title>
    <script>
      (function () {
        var h = location.hostname;
        if (h !== "localhost" && h !== "127.0.0.1") {
          document.documentElement.classList.add("portal-world-locked");
        }
      })();
    </script>
  <style>
    :root {
      --ink: #173247;
      --muted: #4d6478;
      --sea-0: #08344c;
      --sea-1: #0c4d6e;
      --sea-2: #14658a;
      --gold: #f4b740;
      --paper: #f7f4ee;
      --line: rgba(23, 50, 71, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sea-0);
    }
    html.portal-world-locked .app { visibility: hidden; }
    .lock {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      color: #e8f4fb; font-weight: 650;
      background: var(--sea-0);
    }
    html.portal-world-locked .lock { display: flex; }
    .app {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    header.top {
      display: block;
      padding: 10px 16px 8px;
      color: #e7f3fa;
    }
    header.top > div:first-child { min-width: 0; }
    header.top h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    header.top p {
      margin: 4px 0 0;
      max-width: 46rem;
      color: rgba(231, 243, 250, 0.78);
      font-size: 13.5px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .stories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
      margin-top: 8px;
    }
    .stories button {
      font: inherit;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
      color: #f4fbff;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 13px;
    }
    .stories button.is-on {
      background: var(--gold);
      color: #3a2a08;
      border-color: var(--gold);
    }
    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      padding: 0 12px 12px;
    }
    .sea {
      position: relative;
      min-width: 0;
      height: 100%;
      min-height: 0;
      border-radius: 28px;
      overflow: auto;
      display: grid;
      grid-template-areas:
        ". ceo onb"
        "booking admin staff"
        ". parent .";
      grid-template-columns: 1fr 1.08fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 14px 22px;
      align-items: center;
      justify-items: center;
      padding: 10px 360px 12px 14px;
      background:
        radial-gradient(ellipse 28% 22% at 18% 40%, rgba(255,255,255,.16), transparent 70%),
        radial-gradient(ellipse 34% 26% at 50% 48%, rgba(255,255,255,.14), transparent 70%),
        radial-gradient(ellipse 26% 20% at 80% 42%, rgba(255,255,255,.12), transparent 70%),
        radial-gradient(ellipse 24% 18% at 50% 18%, rgba(244,183,64,.16), transparent 70%),
        radial-gradient(ellipse 30% 20% at 50% 80%, rgba(255,255,255,.12), transparent 70%),
        linear-gradient(180deg, var(--sea-2), var(--sea-1) 42%, var(--sea-0));
    }
    .sea svg.routes {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .routes path {
      fill: none;
      stroke: rgba(255,255,255,.45);
      stroke-width: 2;
      stroke-dasharray: 1.2 1.1;
      vector-effect: non-scaling-stroke;
    }
    .routes path.is-hot {
      stroke: var(--gold);
      stroke-width: 3.5;
      stroke-dasharray: none;
    }
    #islands { display: contents; }
    .island {
      position: relative;
      width: min(240px, 100%);
      min-width: 0;
      max-width: 100%;
      padding: 10px 12px 10px;
      border: 0;
      text-align: left;
      color: inherit;
      cursor: pointer;
      border-radius: 46% 54% 50% 50% / 42% 46% 54% 58%;
      box-shadow:
        0 0 0 8px rgba(255,255,255,.14),
        0 16px 0 rgba(0,0,0,.12),
        0 22px 36px rgba(0,0,0,.22);
      z-index: 2;
    }
    .island:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    .island.is-picked { box-shadow: 0 0 0 8px rgba(244,183,64,.55), 0 16px 0 rgba(0,0,0,.12), 0 22px 36px rgba(0,0,0,.22); }
    .island.is-hot {
      box-shadow: 0 0 0 8px rgba(244,183,64,.9), 0 16px 0 rgba(0,0,0,.12), 0 22px 36px rgba(0,0,0,.22);
      animation: pulse 1.1s ease;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .island--ceo { grid-area: ceo; }
    .island--booking { grid-area: booking; }
    .island--admin { grid-area: admin; width: min(260px, 100%); z-index: 3; background: linear-gradient(180deg, #1f8f7e, #14685c); color: #f3fffc; }
    .island--staff { grid-area: staff; }
    .island--onb { grid-area: onb; }
    .island--parent { grid-area: parent; }
    .island--staff { background: linear-gradient(180deg, #3f7ebf, #2a5f96); color: #f4f9ff; border-radius: 52% 48% 46% 54% / 48% 42% 58% 52%; }
    .island--onb { background: linear-gradient(180deg, #6d5bd0, #43358f); color: #f6f3ff; border-radius: 44% 56% 48% 52% / 52% 42% 58% 48%; }
    .island--booking { background: linear-gradient(180deg, #f0d7a0, #e2b86a); color: #4a3412; border-radius: 48% 52% 58% 42% / 46% 54% 46% 54%; }
    .island--parent { background: linear-gradient(180deg, #f6c7bc, #e7a294); color: #5c2c30; border-radius: 50% 50% 46% 54% / 44% 56% 44% 56%; }
    .island--ceo { background: linear-gradient(180deg, #24344d, #172536); color: #f6edd4; border-radius: 42% 58% 48% 52% / 50% 42% 58% 50%; }
    .kicker {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .8;
    }
    .island strong.name {
      display: block;
      margin-top: 2px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .host {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      opacity: .8;
      overflow-wrap: anywhere;
    }
    .chips, .people {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      min-width: 0;
    }
    .chip, .person {
      max-width: 100%;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .chip { background: rgba(255,255,255,.2); }
    .island--booking .chip, .island--parent .chip { background: rgba(255,255,255,.45); }
    .person {
      font: inherit;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      border: 1.5px solid transparent;
    }
    .person--home { background: rgba(255,255,255,.92); color: var(--ink); }
    .person--visit { background: transparent; color: inherit; border-color: currentColor; }
    .person.is-on { outline: 2px solid var(--gold); }
    .traveler {
      position: absolute;
      z-index: 4;
      transform: translate(-50%, -115%);
      min-width: 0;
      max-width: 140px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      pointer-events: none;
      overflow-wrap: anywhere;
    }
    .traveler[hidden] { display: none; }
    .traveler { transition: left .85s ease, top .85s ease; }
    aside.panel {
      position: absolute;
      top: 0;
      right: 12px;
      bottom: 12px;
      width: min(340px, 32vw);
      min-width: 0;
      background: var(--paper);
      border-radius: 22px;
      padding: 16px 16px 18px;
      overflow: auto;
      z-index: 6;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    }
    aside.panel h2 { margin: 0; font-size: 18px; }
    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .block { margin-top: 14px; }
    .block h3 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .row b { font-weight: 750; }
    ol.steps { margin: 0; padding: 0; list-style: none; }
    ol.steps li {
      margin: 0 0 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 13.5px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    ol.steps li.is-now {
      border-color: #e2b14a;
      background: #fff8e8;
    }
    .now {
      margin-top: 12px;
      padding: 12px 12px 10px;
      border-radius: 14px;
      background: #fff8e8;
      border: 1px solid #e2b14a;
      min-width: 0;
    }
    .now b {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #8a5a10;
    }
    .now p {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .pause {
      margin-top: 10px;
      font: inherit;
      font-weight: 750;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .swatch {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: -1px;
    }
    .swatch--home { background: var(--ink); }
    .swatch--visit { background: transparent; border: 1.5px solid var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      .island.is-hot { animation: none; }
      .traveler { transition: none; }
    }
    @media (max-width: 980px) {
      html, body, .app { height: auto; overflow: auto; }
      .sea {
        height: auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 18px 12px 20px;
        overflow: visible;
      }
      .routes, .traveler { display: none !important; }
      .island, .island--admin {
        position: relative;
        left: auto !important;
        top: auto !important;
        transform: none;
        width: min(420px, 100%);
        border-radius: 22px;
      }
      .island.is-hot { animation: none; }
      aside.panel {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        width: auto;
        margin: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="lock">Comprobando la sesion de oficina...</div>
  <div class="app">
    <header class="top">
      <div>
        <h1>El mundo de los portales</h1>
        <p>Seis islas. Cada camino se lee en el panel, paso a paso, sin montarse encima del mapa. No es el parte de hoy.</p>
      </div>
      <div class="stories" id="stories" role="tablist" aria-label="Caminos"></div>
    </header>
    <div class="stage">
      <div class="sea" id="sea">
        <svg class="routes" id="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="islands"></div>
        <div class="traveler" id="traveler" hidden></div>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </div>

        { islands: ["admin", "parent"], links: ["a-p"], text: "En Leads sale Parent portal, no Booking OTP. No hay formulario nuevo. El registro de antes sigue en el archivo." },

    },
    {

      actor: "A la vez",
      steps: [
        { islands: ["booking", "admin"], links: ["b-a"], text: "El servicio esta lleno. Quien ya se registro y quiere esa plaza va a Waiting. No ocupa un asiento en Overview." },
        { islands: ["admin"], links: [], text: "Waiting list es la cola. No es CLIENT. No es LEAD: el LEAD pidio codigo y no termino el registro." },
        { islands: ["admin", "parent"], links: ["a-p"], text: "Cuando se abre un hueco, la oficina ofrece la plaza. Hasta entonces Parent no ve esa sesion como reservada." }
      ]
    },
    {

      actor: "A la vez",
      steps: [

        { islands: ["staff", "admin"], links: ["a-s"], text: "Staff Today muestra el dia libre y el cover. Halo y Quick menu. Parent no ve el dia libre ni COVER NEEDED." },
        { islands: ["parent"], links: ["a-p"], text: "Team solo cambia el nombre cuando el cover ya tiene una persona. Sin nombre, la familia sigue viendo a su instructor." }

    },
    {

        { islands: ["admin", "parent"], links: ["a-p"], text: "Finance, Cancelled services, lo guarda. En Parent, Bookings deja de mostrar ese servicio. Overview deja de pintar al nino desde esa fecha." },

        { islands: ["admin"], links: ["a-p"], text: "Parent consents, en Admin, enseña lo que firmaron. Sin ese si, la foto no sale a la familia." },
        { islands: ["staff", "parent", "admin"], links: ["s-p", "a-p"], text: "Despues del feedback se puede subir la foto de logro. Parent la ve si el consentimiento lo permite. Si no, se queda en la oficina." }
      ]
    },
    {
      id: "credit",
      label: "Credito",

      steps: [
        { islands: ["parent", "admin"], links: ["a-p"], text: "Una sesion que no se hizo puede dejar credito o un makeup. La pantalla de oficina es Absents, credits and refunds." },
        { islands: ["admin", "booking"], links: ["b-a"], text: "El makeup es otra sesion, no un registro nuevo. La plaza del termino sigue, salvo que el servicio se haya cancelado." },
        { islands: ["staff", "admin"], links: ["a-s"], text: "El dia del makeup entra en Schedule y en Staff Today como cualquier sesion. El feedback de ese dia cuenta aparte." }

    {
      id: "onboarding",
      label: "Onboarding",
      actor: "A la vez",
      steps: [
        { islands: ["admin"], links: [], text: "La entrevista vive en Potential workers, en Admin. Desde ahi empieza el alta." },
        { islands: ["onb"], links: ["a-o"], text: "Onboarding pide Job, Health, Starter checklist y Documents (foto, pasaporte, right to work)." },
        { islands: ["onb", "admin"], links: ["a-o"], text: "A la vez: Admin Workers ve el job y el health ya rellenos, y Documents guarda los archivos." },
        { islands: ["onb", "staff"], links: ["o-s"], text: "Misma cuenta y mismo host. En Staff ya estan Today, feedback, timesheet y expenses. Si el alta no esta cerrada, Onboarding sigue en el menu." }
      ]
    },
    {
      id: "timesheet",
      label: "Timesheet",
      actor: "A la vez",
      steps: [
        { islands: ["staff"], links: [], text: "El trabajador abre Timesheet. Las horas no se escriben a mano." },
        { islands: ["admin", "staff"], links: ["a-s"], text: "A la vez: el turno sale del timetable y de Schedule en Admin, y cuenta el feedback de Staff. Sin feedback, el dia sigue pendiente." },
        { islands: ["admin", "staff"], links: ["a-s"], text: "Admin lo descarga para payroll. Si lo envia otra vez, el nuevo sustituye al anterior. El dia 24 a las 23:00 WhatsApp avisa a quien no lo ha mandado." }
      ]
    },
    {
      id: "expense",
      label: "Expense",
      actor: "A la vez",
      steps: [
        { islands: ["staff"], links: [], text: "El trabajador manda el gasto desde Expenses." },
        { islands: ["staff", "admin"], links: ["a-s"], text: "A la vez: Documents en Admin lo guarda con su nombre y el mes. Queda Pending, y la campana puede mostrar el gasto." },
        { islands: ["admin"], links: [], text: "Mark paid cuando ya esta pagado. La fecha es el dia en que se pulsa, no el mes del gasto." }
      ]
    }
  ];

  var byId = {};
  ISLANDS.forEach(function (island) { byId[island.id] = island; });

  var state = {
    island: "admin",
    person: "",
    story: "lead",
    step: 0,
    playing: true,
    paused: false,
    timer: 0
  };

  var sea = document.getElementById("sea");
  var routesEl = document.getElementById("routes");
  var islandsEl = document.getElementById("islands");
  var traveler = document.getElementById("traveler");
  var panel = document.getElementById("panel");
  var storiesEl = document.getElementById("stories");

  function islandEl(id) {
    return islandsEl.querySelector('[data-island="' + id + '"]');
  }

  var centers = {};

  function measure() {
    var seaR = sea.getBoundingClientRect();
    if (!seaR.width || !seaR.height) return;
    ISLANDS.forEach(function (island) {
      var el = islandEl(island.id);
      if (!el) return;
      var r = el.getBoundingClientRect();
      centers[island.id] = {
        x: ((r.left + r.width / 2 - seaR.left) / seaR.width) * 100,
        y: ((r.top + r.height / 2 - seaR.top) / seaR.height) * 100
      };
    });
    routesEl.innerHTML = LINKS.map(function (link) {
      var a = centers[link.from];
      var b = centers[link.to];
      if (!a || !b) return "";
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var pad = 9;
      var x1 = a.x + (dx / len) * pad;
      var y1 = a.y + (dy / len) * pad;
      var x2 = b.x - (dx / len) * pad;
      var y2 = b.y - (dy / len) * pad;
      var bow = 7;
      var cx = (x1 + x2) / 2 + (-dy / len) * bow;
      var cy = (y1 + y2) / 2 + (dx / len) * bow;
      var d = "M " + x1 + " " + y1 + " Q " + cx + " " + cy + " " + x2 + " " + y2;
      return '<path data-link="' + link.id + '" d="' + d + '"></path>';
    }).join("");
  }

  function renderIslands() {
    islandsEl.innerHTML = ISLANDS.map(function (island) {
      var chips = island.chips.map(function (c) {
        return '<span class="chip">' + c + "</span>";
      }).join("");
      return '' +
        '<article class="island ' + island.cls + '" data-island="' + island.id + '" tabindex="0" role="button" aria-label="' + island.name + '">' +
          '<span class="kicker">' + island.kicker + "</span>" +
          '<strong class="name">' + island.name + "</strong>" +
          '<span class="host">' + island.short + "</span>" +
          '<div class="chips">' + chips + "</div>" +
        "</article>";
    }).join("");
  }

  function renderStories() {
    storiesEl.innerHTML = STORIES.map(function (story) {
      var on = story.id === state.story ? " is-on" : "";
      return '<button type="button" class="' + on.trim() + '" data-story="' + story.id + '" role="tab">' + story.label + "</button>";
    }).join("");
  }

  function storyById(id) {
    for (var i = 0; i < STORIES.length; i++) if (STORIES[i].id === id) return STORIES[i];
    return STORIES[0];
  }

  function stepIslands(step) {
    if (step.islands && step.islands.length) return step.islands;
    return step.island ? [step.island] : [];
  }

  function stepLinks(step) {
    if (step.links && step.links.length) return step.links;
    return step.link ? [step.link] : [];
  }

  function stepTitle(step) {
    return stepIslands(step).map(function (id) {
      return byId[id] ? byId[id].name : id;
    }).join(" + ");
  }

  function setHot() {
    var story = storyById(state.story);
    var step = story.steps[state.step] || story.steps[0];
    var hotIslands = stepIslands(step);
    var hotLinks = stepLinks(step);
    Array.prototype.forEach.call(islandsEl.querySelectorAll(".island"), function (el) {
      var id = el.getAttribute("data-island");
      el.classList.toggle("is-picked", id === state.island);
      el.classList.toggle("is-hot", (state.playing || state.paused) && hotIslands.indexOf(id) !== -1);
    });
    Array.prototype.forEach.call(routesEl.querySelectorAll("path"), function (path) {
      path.classList.toggle("is-hot", (state.playing || state.paused) && hotLinks.indexOf(path.getAttribute("data-link")) !== -1);
    });
    if (!state.playing && !state.paused) {
      traveler.hidden = true;
      return;
    }
    if (hotIslands.length < 2) {
      traveler.hidden = true;
      return;
    }
    var el = islandEl(hotIslands[0]);
    var seaR = sea.getBoundingClientRect();
    var r = el ? el.getBoundingClientRect() : null;
    if (!r || !seaR.width) return;
    traveler.hidden = false;
    traveler.textContent = "A la vez";
    var roomBelow = seaR.bottom - r.bottom;
    traveler.style.left = ((r.left + r.width / 2 - seaR.left) / seaR.width) * 100 + "%";
    if (roomBelow > 36) {
      traveler.style.top = ((r.bottom - seaR.top) / seaR.height) * 100 + "%";
      traveler.style.transform = "translate(-50%, 8px)";
    } else {
      traveler.style.top = ((r.top - seaR.top) / seaR.height) * 100 + "%";
      traveler.style.transform = "translate(-50%, -120%)";
    }
  }

  function renderPanel() {
    if (state.playing || state.paused) {
      var story = storyById(state.story);
      var step = story.steps[state.step] || story.steps[0];
      var steps = story.steps.map(function (item, i) {
        return '<li data-step="' + i + '"' + (i === state.step ? ' class="is-now"' : "") + "><b>" + stepTitle(item) + ".</b> " + item.text + "</li>";
      }).join("");
      panel.innerHTML =
        "<h2>" + story.label + "</h2>" +
        '<p class="sub">Paso ' + (state.step + 1) + " de " + story.steps.length + ". Las islas en dorado son este paso. Pulsa una isla si quieres leer solo esa isla.</p>" +
        '<div class="now"><b>' + stepTitle(step) + '</b><p>' + step.text + "</p></div>" +
        '<button type="button" class="pause" data-pause="1">' + (state.paused ? "Seguir" : "Pausa") + "</button>" +
        '<div class="block"><ol class="steps">' + steps + "</ol></div>";
      return;
    }
    var island = byId[state.island];
    var happens = island.happens.map(function (line) {
      return '<p class="row">' + line + "</p>";
    }).join("");
    var links = LINKS.filter(function (link) {
      return link.from === island.id || link.to === island.id;
    }).map(function (link) {
      var other = link.from === island.id ? byId[link.to] : byId[link.from];
      return '<p class="row"><b>' + other.name + ".</b> " + link.label + ".</p>";
    }).join("");
    panel.innerHTML =
      "<h2>" + island.name + "</h2>" +
      '<p class="sub">' + island.host + "</p>" +
      '<div class="block"><h3>Que pasa</h3>' + happens + "</div>" +
      '<div class="block"><h3>Como se habla con las otras</h3>' + links + "</div>";
  }

  function stop() {
    state.playing = false;
    state.paused = false;
    if (state.timer) window.clearTimeout(state.timer);
    state.timer = 0;
  }

  function tick() {
    if (!state.playing || state.paused) return;
    var story = storyById(state.story);
    state.timer = window.setTimeout(function () {
      state.step = (state.step + 1) % story.steps.length;
      paint();
      tick();
    }, 5200);
  }

  function play(id) {
    state.story = id;
    state.step = 0;
    state.playing = true;
    state.paused = false;
    state.person = "";
    if (state.timer) window.clearTimeout(state.timer);
    paint();
    tick();
  }

  function paint() {
    renderStories();
    setHot();
    renderPanel();
  }

  islandsEl.addEventListener("click", function (ev) {
    var personBtn = ev.target.closest("[data-person]");
    var island = ev.target.closest("[data-island]");
    if (!island) return;
    stop();
    state.island = island.getAttribute("data-island");
    state.person = personBtn ? personBtn.getAttribute("data-person") : "";
    paint();
  });

  islandsEl.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var island = ev.target.closest("[data-island]");
    if (!island || ev.target !== island) return;
    ev.preventDefault();
    stop();
    state.island = island.getAttribute("data-island");
    state.person = "";
    paint();
  });

  storiesEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-story]");
    if (!btn) return;
    play(btn.getAttribute("data-story"));
  });

  panel.addEventListener("click", function (ev) {
    var pauseBtn = ev.target.closest("[data-pause]");
    if (pauseBtn && (state.playing || state.paused)) {
      state.paused = !state.paused;
      if (state.timer) window.clearTimeout(state.timer);
      state.timer = 0;
      if (!state.paused) tick();
      paint();
      return;
    }
    var step = ev.target.closest("[data-step]");
    if (!step || (!state.playing && !state.paused)) return;
    if (state.timer) window.clearTimeout(state.timer);
    state.step = Number(step.getAttribute("data-step")) || 0;
    state.paused = true;
    paint();
  });

  renderIslands();
  play("lead");
  window.requestAnimationFrame(function () {
    measure();
    setHot();
  });

  window.addEventListener("resize", function () {
    measure();
    setHot();
  });
})();
  </script>

      try {
