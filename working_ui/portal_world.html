<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>El mundo de los portales</title>
    <script>
      (function () {
        var h = location.hostname;
        if (h !== "localhost" && h !== "127.0.0.1") {
          document.documentElement.classList.add("portal-world-locked");
        }
      })();
    </script>
  <style>
    :root {
      --ink: #173247;
      --muted: #4d6478;
      --sea-0: #08344c;
      --sea-1: #0c4d6e;
      --sea-2: #14658a;
      --gold: #f4b740;
      --paper: #f7f4ee;
      --line: rgba(23, 50, 71, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sea-0);
    }
    html.portal-world-locked .app { visibility: hidden; }
    .lock {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      color: #e8f4fb; font-weight: 650;
      background: var(--sea-0);
    }
    html.portal-world-locked .lock { display: flex; }
    .app {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    header.top {
      display: block;
      padding: 10px 16px 8px;
      color: #e7f3fa;
    }
    header.top > div:first-child { min-width: 0; }
    header.top h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    header.top p {
      margin: 4px 0 0;
      max-width: 46rem;
      color: rgba(231, 243, 250, 0.78);
      font-size: 13.5px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .stories {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      min-width: 0;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .stories button {
      flex: 0 0 auto;
      font: inherit;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
      color: #f4fbff;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 13px;
    }
    .stories button.is-on {
      background: var(--gold);
      color: #3a2a08;
      border-color: var(--gold);
    }
    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      padding: 0 12px 12px;
    }
    .sea {
      position: relative;
      min-width: 0;
      height: 100%;
      min-height: 0;
      border-radius: 28px;
      overflow: auto;
      display: grid;
      grid-template-areas:
        "ceo auto onb"
        "booking admin staff"
        ". parent .";
      grid-template-columns: minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);
      grid-template-rows: auto auto auto;
      gap: 16px 26px;
      align-items: center;
      justify-items: center;
      padding: 10px 360px 12px 14px;
      background:
        radial-gradient(ellipse 28% 22% at 18% 40%, rgba(255,255,255,.16), transparent 70%),
        radial-gradient(ellipse 34% 26% at 50% 48%, rgba(255,255,255,.14), transparent 70%),
        radial-gradient(ellipse 26% 20% at 80% 42%, rgba(255,255,255,.12), transparent 70%),
        radial-gradient(ellipse 24% 18% at 50% 18%, rgba(244,183,64,.16), transparent 70%),
        radial-gradient(ellipse 30% 20% at 50% 80%, rgba(255,255,255,.12), transparent 70%),
        linear-gradient(180deg, var(--sea-2), var(--sea-1) 42%, var(--sea-0));
    }
    .sea svg.routes {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .routes path {
      fill: none;
      stroke: rgba(255,255,255,.45);
      stroke-width: 2;
      stroke-dasharray: 1.2 1.1;
      vector-effect: non-scaling-stroke;
    }
    .routes path.is-hot {
      stroke: var(--gold);
      stroke-width: 3.5;
      stroke-dasharray: none;
    }
    .routes circle.run {
      fill: #fff;
      stroke: #f4b740;
      stroke-width: .35;
    }
    #islands { display: contents; }
    .island {
      position: relative;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 8px 10px 10px;
      border: 0;
      text-align: left;
      color: inherit;
      cursor: pointer;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
      z-index: 2;
    }
    .island:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .island.is-picked { box-shadow: 0 0 0 3px rgba(244,183,64,.7), 0 10px 22px rgba(0,0,0,.22); }
    .island.is-hot { box-shadow: 0 0 0 3px #f4b740, 0 10px 22px rgba(0,0,0,.22); }
    .island--ceo { grid-area: ceo; background: linear-gradient(180deg, #24344d, #172536); color: #f6edd4; }
    .island--auto { grid-area: auto; background: linear-gradient(180deg, #e2a322, #b47410); color: #3a2804; }
    .island--booking { grid-area: booking; background: linear-gradient(180deg, #f0d7a0, #e2b86a); color: #4a3412; }
    .island--admin { grid-area: admin; z-index: 3; background: linear-gradient(180deg, #1f8f7e, #14685c); color: #f3fffc; }
    .island--staff { grid-area: staff; background: linear-gradient(180deg, #3f7ebf, #2a5f96); color: #f4f9ff; }
    .island--onb { grid-area: onb; background: linear-gradient(180deg, #6d5bd0, #43358f); color: #f6f3ff; }
    .island--parent { grid-area: parent; background: linear-gradient(180deg, #f6c7bc, #e7a294); color: #5c2c30; }
    .kicker {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .8;
    }
    .island strong.name {
      display: block;
      margin-top: 2px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .host {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      opacity: .8;
      overflow-wrap: anywhere;
    }
    .chips, .people {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      min-width: 0;
    }
    .chip, .person {
      max-width: 100%;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .chip { background: rgba(255,255,255,.2); }
    .island--booking .chip, .island--parent .chip, .island--auto .chip { background: rgba(255,255,255,.55); color: #3a2804; }
    #dots {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }
    .dot-run {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #f4b740;
      box-shadow: 0 0 0 5px rgba(244,183,64,.35);
      transform: translate(-50%, -50%);
    }
    .person {
      font: inherit;
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      border: 1.5px solid transparent;
    }
    .person--home { background: rgba(255,255,255,.92); color: var(--ink); }
    .person--visit { background: transparent; color: inherit; border-color: currentColor; }
    .person.is-on { outline: 2px solid var(--gold); }
    .traveler {
      position: absolute;
      z-index: 4;
      transform: translate(-50%, -115%);
      min-width: 0;
      max-width: 140px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      pointer-events: none;
      overflow-wrap: anywhere;
    }
    .traveler[hidden] { display: none; }
    .traveler { transition: left .85s ease, top .85s ease; }
    aside.panel {
      position: absolute;
      top: 0;
      right: 12px;
      bottom: 12px;
      width: min(340px, 32vw);
      min-width: 0;
      background: var(--paper);
      border-radius: 22px;
      padding: 16px 16px 18px;
      overflow: auto;
      z-index: 6;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    }
    aside.panel h2 { margin: 0; font-size: 18px; }
    .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .block { margin-top: 14px; }
    .block h3 {
      margin: 0 0 6px;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .row b { font-weight: 750; }
    ol.steps { margin: 0; padding: 0; list-style: none; }
    ol.steps li {
      margin: 0 0 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 13.5px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    ol.steps li.is-now {
      border-color: #e2b14a;
      background: #fff8e8;
    }
    .now {
      margin-top: 12px;
      padding: 12px 12px 10px;
      border-radius: 14px;
      background: #fff8e8;
      border: 1px solid #e2b14a;
      min-width: 0;
    }
    .now b {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #8a5a10;
    }
    .now p {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .pause {
      margin-top: 10px;
      font: inherit;
      font-weight: 750;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .swatch {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: -1px;
    }
    .swatch--home { background: var(--ink); }
    .swatch--visit { background: transparent; border: 1.5px solid var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      .island.is-hot { animation: none; }
      .traveler { transition: none; }
    }
    @media (max-width: 980px) {
      html, body, .app { height: auto; overflow: auto; }
      .stage { display: flex; flex-direction: column; }
      .sea {
        height: 640px;
        min-height: 640px;
        padding: 10px;
        overflow: hidden;
      }
      aside.panel {
        position: relative;
        top: auto;
        right: auto;
        bottom: auto;
        width: auto;
        margin: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="lock">Comprobando la sesion de oficina...</div>
  <div class="app">
    <header class="top">
      <div>
        <h1>El mundo de los portales</h1>
        <p>Siete cuadros. La linea dorada se enciende y el punto viaja hasta el portal que se entera. El texto se lee en el panel. No es el parte de hoy.</p>
      </div>

    </header>
    <div class="stage">
      <div class="sea" id="sea">
        <svg class="routes" id="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="dots"></div>
        <div id="islands"></div>
        <div class="traveler" id="traveler" hidden></div>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </div>
  </div>

  var sea = document.getElementById("sea");
  var routesEl = document.getElementById("routes");
  var dotsEl = document.getElementById("dots");

  function islandEl(id) {
    return islandsEl.querySelector('[data-island="' + id + '"]');
  }

  var centers = {};

  function boxOf(id) {
    var el = islandEl(id);
    var seaR = sea.getBoundingClientRect();
    if (!el || !seaR.width || !seaR.height) return null;
    var r = el.getBoundingClientRect();
    return {
      cx: ((r.left + r.width / 2 - seaR.left) / seaR.width) * 100,
      cy: ((r.top + r.height / 2 - seaR.top) / seaR.height) * 100,
      hw: (r.width / seaR.width) * 50,
      hh: (r.height / seaR.height) * 50
    };
  }

  function rimPoint(box, toward, out) {
    var dx = toward.cx - box.cx;
    var dy = toward.cy - box.cy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var sx = Math.abs(dx) < 0.01 ? 999 : box.hw / Math.abs(dx);
    var sy = Math.abs(dy) < 0.01 ? 999 : box.hh / Math.abs(dy);
    var s = Math.min(sx, sy);
    return {
      x: box.cx + dx * s + (dx / len) * out,
      y: box.cy + dy * s + (dy / len) * out
    };
  }

  function hitsBox(x, y, boxes, skip) {
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      if (skip[box.id]) continue;
      if (x > box.l + 0.3 && x < box.r - 0.3 && y > box.t + 0.3 && y < box.b - 0.3) return true;
    }
    return false;
  }

  function curveHits(p1, c, p2, boxes, skip) {
    for (var s = 1; s < 14; s++) {
      var t = s / 14;
      var m = 1 - t;
      var x = m * m * p1.x + 2 * m * t * c.x + t * t * p2.x;
      var y = m * m * p1.y + 2 * m * t * c.y + t * t * p2.y;
      if (hitsBox(x, y, boxes, skip)) return true;
    }
    return false;
  }

  function polyHits(pts, boxes, skip) {
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i];
      var b = pts[i + 1];
      for (var s = 1; s < 12; s++) {
        var u = s / 12;
        if (hitsBox(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u, boxes, skip)) return true;
      }
    }
    return false;
  }

  function gapMids(marks) {
    marks.sort(function (a, b) { return a - b; });
    var out = [];
    var prev = marks[0];
    for (var i = 1; i < marks.length; i++) {
      if (marks[i] - prev > 1.15) out.push((prev + marks[i]) / 2);
      prev = marks[i];
    }
    return out;
  }

  function routeLink(link, byBox, boxes) {
    var a = byBox[link.from];
    var b = byBox[link.to];
    if (!a || !b) return "";
    var p1 = rimPoint(a, b, 0.8);
    var p2 = rimPoint(b, a, 0.8);
    var skip = {};
    skip[link.from] = true;
    skip[link.to] = true;
    var dx = p2.x - p1.x;
    var dy = p2.y - p1.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var bows = [4, -4, 8, -8, 14, -14, 22, -22];
    if (typeof link.bow === "number") bows.unshift(link.bow, -link.bow);
    for (var i = 0; i < bows.length; i++) {
      var bow = bows[i];
      var c = {
        x: (p1.x + p2.x) / 2 + (-dy / len) * bow,
        y: (p1.y + p2.y) / 2 + (dx / len) * bow
      };
      if (!curveHits(p1, c, p2, boxes, skip)) {
        return "M " + p1.x + " " + p1.y + " Q " + c.x + " " + c.y + " " + p2.x + " " + p2.y;
      }
    }
    var xs = gapMids([0, 100].concat(boxes.map(function (box) { return box.l; }), boxes.map(function (box) { return box.r; })));
    var best = null;
    xs.forEach(function (gx) {
      var pts = [p1, { x: gx, y: p1.y }, { x: gx, y: p2.y }, p2];
      if (polyHits(pts, boxes, skip)) return;
      var cost = Math.abs(gx - p1.x) + Math.abs(gx - p2.x);
      if (!best || cost < best.cost) best = { cost: cost, pts: pts };
    });
    if (!best) {
      var ys = gapMids([0, 100].concat(boxes.map(function (box) { return box.t; }), boxes.map(function (box) { return box.b; })));
      ys.forEach(function (gy) {
        var pts = [p1, { x: p1.x, y: gy }, { x: p2.x, y: gy }, p2];
        if (polyHits(pts, boxes, skip)) return;
        var cost = Math.abs(gy - p1.y) + Math.abs(gy - p2.y);
        if (!best || cost < best.cost) best = { cost: cost, pts: pts };
      });
    }
    if (!best) return "M " + p1.x + " " + p1.y + " L " + p2.x + " " + p2.y;
    return "M " + best.pts.map(function (p) { return p.x + " " + p.y; }).join(" L ");
  }

  function measure() {
    var seaR = sea.getBoundingClientRect();
    if (!seaR.width || !seaR.height) return;
    var byBox = {};
    var boxes = [];
    ISLANDS.forEach(function (island) {
      var box = boxOf(island.id);
      if (!box) return;
      box.id = island.id;
      box.l = box.cx - box.hw;
      box.t = box.cy - box.hh;
      box.r = box.cx + box.hw;
      box.b = box.cy + box.hh;
      byBox[island.id] = box;
      boxes.push(box);
    });
    centers = byBox;
    routesEl.innerHTML = LINKS.map(function (link) {
      var d = routeLink(link, byBox, boxes);
      if (!d) return "";
      return '<path data-link="' + link.id + '" d="' + d + '"></path>';
    }).join("");
  }

  function stopDots() {
    if (state.dotFrame) window.cancelAnimationFrame(state.dotFrame);
    state.dotFrame = 0;
    dotsEl.innerHTML = "";
  }

  function runDots() {
    stopDots();
    if (!state.playing && !state.paused) return;
    var reduce = false;
    try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (err) { reduce = false; }
    if (reduce) return;
    var paths = routesEl.querySelectorAll("path.is-hot");
    if (!paths.length) return;
    var dots = [];
    Array.prototype.forEach.call(paths, function (path) {
      var dot = document.createElement("div");
      dot.className = "dot-run";
      dotsEl.appendChild(dot);
      dots.push({ el: dot, path: path, len: path.getTotalLength() || 1, t0: performance.now() });
    });
    function frame(now) {
      dots.forEach(function (dot) {
        var u = ((now - dot.t0) % 1600) / 1600;
        var pt = dot.path.getPointAtLength(u * dot.len);
        dot.el.style.left = pt.x + "%";
        dot.el.style.top = pt.y + "%";
      });
      state.dotFrame = window.requestAnimationFrame(frame);
    }
    state.dotFrame = window.requestAnimationFrame(frame);
  }

  function renderIslands() {
    islandsEl.innerHTML = ISLANDS.map(function (island) {
      var chips = island.chips.map(function (c) {
        return '<span class="chip">' + c + "</span>";
      }).join("");
      return '' +
        '<article class="island ' + island.cls + '" data-island="' + island.id + '" tabindex="0" role="button" aria-label="' + island.name + '">' +
          '<span class="kicker">' + island.kicker + "</span>" +
          '<strong class="name">' + island.name + "</strong>" +
          '<span class="host">' + island.short + "</span>" +
          '<div class="chips">' + chips + "</div>" +
        "</article>";
    }).join("");
  }

  function renderStories() {
    storiesEl.innerHTML = STORIES.map(function (story) {
      var on = story.id === state.story ? " is-on" : "";
      return '<button type="button" class="' + on.trim() + '" data-story="' + story.id + '" role="tab">' + story.label + "</button>";
    }).join("");
  }

  function storyById(id) {
    for (var i = 0; i < STORIES.length; i++) if (STORIES[i].id === id) return STORIES[i];
    return STORIES[0];
  }

  function stepIslands(step) {
    if (step.islands && step.islands.length) return step.islands;
    return step.island ? [step.island] : [];
  }

  function stepLinks(step) {
    if (step.links && step.links.length) return step.links;
    return step.link ? [step.link] : [];
  }

  function stepTitle(step) {
    return stepIslands(step).map(function (id) {
      return byId[id] ? byId[id].name : id;
    }).join(" + ");
  }

  function setHot() {
    var story = storyById(state.story);
    var step = story.steps[state.step] || story.steps[0];
    var hotIslands = stepIslands(step);
    var hotLinks = stepLinks(step);
    Array.prototype.forEach.call(islandsEl.querySelectorAll(".island"), function (el) {
      var id = el.getAttribute("data-island");
      el.classList.toggle("is-picked", id === state.island);
      el.classList.toggle("is-hot", (state.playing || state.paused) && hotIslands.indexOf(id) !== -1);
    });
    Array.prototype.forEach.call(routesEl.querySelectorAll("path"), function (path) {
      path.classList.toggle("is-hot", (state.playing || state.paused) && hotLinks.indexOf(path.getAttribute("data-link")) !== -1);
    });
    traveler.hidden = true;
    runDots();
  }

  function renderPanel() {
    if (state.playing || state.paused) {
      var story = storyById(state.story);
      var step = story.steps[state.step] || story.steps[0];
      var steps = story.steps.map(function (item, i) {
        return '<li data-step="' + i + '"' + (i === state.step ? ' class="is-now"' : "") + "><b>" + stepTitle(item) + ".</b> " + item.text + "</li>";
      }).join("");
      panel.innerHTML =
        "<h2>" + story.label + "</h2>" +
        '<p class="sub">Paso ' + (state.step + 1) + " de " + story.steps.length + ". La linea dorada se enciende y el punto viaja hasta quien se entera. Pulsa una caja para leer solo esa.</p>" +
        '<div class="now"><b>' + stepTitle(step) + '</b><p>' + step.text + "</p></div>" +
        '<button type="button" class="pause" data-pause="1">' + (state.paused ? "Seguir" : "Pausa") + "</button>" +
        '<div class="block"><ol class="steps">' + steps + "</ol></div>";
      return;
    }
    var island = byId[state.island];
    var happens = island.happens.map(function (line) {
      return '<p class="row">' + line + "</p>";
    }).join("");
    var links = LINKS.filter(function (link) {
      return link.from === island.id || link.to === island.id;
    }).map(function (link) {
      var other = link.from === island.id ? byId[link.to] : byId[link.from];
      return '<p class="row"><b>' + other.name + ".</b> " + link.label + ".</p>";
    }).join("");
    panel.innerHTML =
      "<h2>" + island.name + "</h2>" +
      '<p class="sub">' + island.host + "</p>" +
      '<div class="block"><h3>Que pasa</h3>' + happens + "</div>" +
      '<div class="block"><h3>Como se habla con las otras</h3>' + links + "</div>";
  }

  function stop() {
    state.playing = false;
    state.paused = false;
    if (state.timer) window.clearTimeout(state.timer);
    state.timer = 0;
    stopDots();
  }

  function tick() {
    if (!state.playing || state.paused) return;
    var story = storyById(state.story);
    state.timer = window.setTimeout(function () {
      state.step = (state.step + 1) % story.steps.length;
      paint();
      tick();
    }, 5200);
  }

  function play(id) {
    state.story = id;
    state.step = 0;
    state.playing = true;
    state.paused = false;
    state.person = "";
    if (state.timer) window.clearTimeout(state.timer);
    paint();
    tick();
  }

  function paint() {
    renderStories();
    setHot();
    renderPanel();
  }

  islandsEl.addEventListener("click", function (ev) {
    var personBtn = ev.target.closest("[data-person]");
    var island = ev.target.closest("[data-island]");
    if (!island) return;
    stop();
    state.island = island.getAttribute("data-island");
    state.person = personBtn ? personBtn.getAttribute("data-person") : "";
    paint();
  });

  islandsEl.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var island = ev.target.closest("[data-island]");
    if (!island || ev.target !== island) return;
    ev.preventDefault();
    stop();
    state.island = island.getAttribute("data-island");
    state.person = "";
    paint();
  });

  storiesEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-story]");
    if (!btn) return;
    play(btn.getAttribute("data-story"));
  });

  panel.addEventListener("click", function (ev) {
    var pauseBtn = ev.target.closest("[data-pause]");
    if (pauseBtn && (state.playing || state.paused)) {
      state.paused = !state.paused;
      if (state.timer) window.clearTimeout(state.timer);
      state.timer = 0;
      if (!state.paused) tick();
      paint();
      return;
    }
    var step = ev.target.closest("[data-step]");
    if (!step || (!state.playing && !state.paused)) return;
    if (state.timer) window.clearTimeout(state.timer);
    state.step = Number(step.getAttribute("data-step")) || 0;
    state.paused = true;
    paint();
  });

  renderIslands();
  play("lead");

  var lastSeaSize = "";
  function layoutRoutes() {
    var rect = sea.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var key = Math.round(rect.width) + "x" + Math.round(rect.height);
    if (key === lastSeaSize && routesEl.querySelector("path")) return;
    lastSeaSize = key;
    measure();
    setHot();
  }
  window.requestAnimationFrame(layoutRoutes);
  window.addEventListener("resize", layoutRoutes);
  if (window.ResizeObserver) new ResizeObserver(layoutRoutes).observe(sea);
})();
  </script>

      document.documentElement.classList.add("portal-world-locked");
      try {
        var auth = await import("/portal/auth-handler.js?v=20261003-world");
        await auth.bootstrapDashboardSupabase({ page: "admin" });
        document.documentElement.classList.remove("portal-world-locked");
        document.documentElement.classList.add("portal-world-ready");
      } catch (err) {
        location.replace("/login.html");
      }
    }
  </script>
