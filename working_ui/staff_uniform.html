<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f8fb" />
  <title>My Uniform | clubSENsational Portal</title>
  <script src="/portal-static-bootstrap.js"></script>
  <script>
    try {
      if (typeof portalEnsureBridgeCached === "function") portalEnsureBridgeCached();
    } catch (_) {}
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;overflow-x:hidden}
    body{
      font-family:Open Sans,Arial,sans-serif;
      background:#f4f8fb;
      color:#102238;
      min-height:100%;
      min-height:100dvh;
      padding:max(12px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
    }
    .page{max-width:640px;margin:0 auto;min-width:0}
    .back{
      display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:0;
      border:0;background:none;color:#2d84b3;font-size:14px;font-weight:700;cursor:pointer;font:inherit;text-decoration:none;
    }
    .back:hover,.back:focus-visible{text-decoration:underline}
    h1{margin:0 0 6px;font-size:22px;color:#0b2a5b;overflow-wrap:break-word}
    .intro{margin:0 0 14px;font-size:13px;line-height:1.45;color:#62758a;overflow-wrap:break-word}
    .card{
      background:#fff;border:1px solid #e6ecf4;border-radius:14px;
      box-shadow:0 8px 24px rgba(17,24,39,.06);padding:14px;margin:0 0 12px;min-width:0;
    }
    .card h2{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:#62758a}
    .row{
      border:1px solid #e6ecf4;border-radius:12px;padding:10px;margin:0 0 8px;min-width:0;
    }
    .row strong{display:block;color:#0b2a5b;overflow-wrap:break-word}
    .meta{font-size:12px;color:#62758a;margin-top:4px;overflow-wrap:break-word;line-height:1.4}
    .pill{
      display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;
      background:#eef6fb;color:#0b2a5b;border:1px solid #c5d9ea;
    }
    .pill--warn{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
    .pill--ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    label{display:block;font-size:12px;color:#62758a;margin:8px 0 4px}
    input,select,textarea{
      width:100%;padding:10px 12px;border:1px solid #b0c7e2;border-radius:10px;
      font:inherit;font-size:15px;min-width:0;background:#fff;
    }
    textarea{min-height:72px;resize:vertical}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;min-height:44px;
      border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font:inherit;
      background:#0b2a5b;color:#fff;touch-action:manipulation;margin-top:8px;
    }
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn--sec{
      background:#e4edf8!important;color:#0b2a5b!important;border:1px solid #b0c7e2!important;
    }
    .err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 12px;border-radius:10px;margin:0 0 12px;overflow-wrap:break-word}
    .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:10px 12px;border-radius:10px;margin:0 0 12px;overflow-wrap:break-word}
    .muted{color:#62758a;font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
    @media(max-width:420px){.grid2{grid-template-columns:1fr}}
    .charge-note{font-size:12px;color:#c2410c;margin:6px 0 0;overflow-wrap:break-word}
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="staff_dashboard.html">Back to dashboard</a>
    <h1>My Uniform</h1>
    <p class="intro">Your issued uniform record. Confirm receipt with your typed full name. Allocation depends on role: Day Centre / Bespoke = 2 T-shirts + 2 sweatshirts; support (zero hours) = 1 + 1; swimming = none for now.</p>
    <div id="msg" hidden></div>
    <div id="app"><p class="muted">Loading…</p></div>
  </div>

  <script type="module">
    const DEFAULT_SUPABASE_URL = "https://cklpnwhlqsulpmkipmqb.supabase.co";
    const DEFAULT_SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrbHBud2hscXN1bHBta2lwbXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMDg4NzIsImV4cCI6MjA5MTc4NDg3Mn0.-T7rVyDHQbzMqEKOVz6fi3OlZdB_gPH2i5p-ZPveopE";

    const SUPABASE_URL = String(window.SUPABASE_URL || DEFAULT_SUPABASE_URL).replace(/\/$/, "");
    const SUPABASE_ANON_KEY = String(window.SUPABASE_ANON_KEY || DEFAULT_SUPABASE_ANON_KEY);

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showMsg(text, kind) {
      const el = document.getElementById("msg");
      if (!el) return;
      el.hidden = !text;
      el.className = kind === "err" ? "err" : "ok";
      el.textContent = text || "";
    }

    async function getClient() {
      try {
        const { bootstrapDashboardSupabase } = await import(
          "/portal/auth-handler.js?v=20260610-profile-bridge"
        );
        await bootstrapDashboardSupabase({ page: "staff" });
      } catch (_) {}
      const { getSupabaseClient } = await import(
        "/portal/supabase-client.js?v=20260901-uniform"
      );
      return getSupabaseClient();
    }

    async function edgePost(sb, name, body) {
      const { data: sessData } = await sb.auth.getSession();
      const token = sessData?.session?.access_token;
      if (!token) return { ok: false, error: "session_expired" };
      const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
          apikey: SUPABASE_ANON_KEY,
        },
        body: JSON.stringify(body || {}),
      });
      let j = null;
      try {
        j = await res.json();
      } catch (_) {
        j = null;
      }
      if (!res.ok || !j || j.ok === false) {
        return {
          ok: false,
          error: (j && (j.error || j.message)) || `request_failed_${res.status}`,
        };
      }
      return j;
    }

    function renderIssue(iss) {
      const pending = !iss.staff_ack_at && iss.status === "issued";
      const pill = pending
        ? '<span class="pill pill--warn">Awaiting your confirmation</span>'
        : iss.status === "issued"
          ? '<span class="pill pill--ok">Confirmed</span>'
          : `<span class="pill">${esc(iss.status)}</span>`;
      let ackForm = "";
      if (pending) {
        ackForm =
          `<div style="margin-top:10px">` +
          `<label for="ack-${esc(iss.id)}">Type your full name to confirm receipt</label>` +
          `<input id="ack-${esc(iss.id)}" type="text" autocomplete="name" placeholder="Full name" />` +
          `<button type="button" class="btn" data-ack="${esc(iss.id)}">Confirm receipt</button>` +
          `</div>`;
      }
      return (
        `<div class="row">` +
        `<strong>${esc(iss.item_name || "Item")} · ${esc(iss.size)} · qty ${esc(String(iss.qty))}</strong>` +
        `<div class="meta">` +
        `${esc(iss.issue_type || "")} · issued ${esc(String(iss.issued_at || "").slice(0, 10))}` +
        (iss.reason ? ` · ${esc(iss.reason)}` : "") +
        (iss.charge_applies
          ? ` · £${esc(String(iss.charge_gbp || 5))} replacement charge`
          : "") +
        `</div>` +
        `<div class="meta">You: ${esc(iss.staff_ack_name || "pending")}` +
        (iss.staff_ack_at ? ` @ ${esc(String(iss.staff_ack_at).replace("T", " ").slice(0, 16))}` : "") +
        `<br>Issuer: ${esc(iss.issuer_ack_name || "—")}` +
        (iss.issuer_ack_at
          ? ` @ ${esc(String(iss.issuer_ack_at).replace("T", " ").slice(0, 16))}`
          : "") +
        `</div>${pill}${ackForm}</div>`
      );
    }

    function render(data, sb) {
      const app = document.getElementById("app");
      if (!app) return;
      const issues = data.issues || [];
      const actor = data.actor || {};
      const defaultLabel =
        (data.default_initial && data.default_initial.label) ||
        "2 x Grey Mixed Cotton T-Shirts";

      let issueManager = "";
      if (actor.can_issue) {
        const staffOpts = (data.staff_directory || [])
          .map(
            (s) =>
              `<option value="${esc(s.id)}">${esc(s.full_name || s.username || s.id)}</option>`,
          )
          .join("");
        const itemOpts = (data.items || [])
          .map(
            (it) =>
              `<option value="${esc(it.id)}" ${
                it.sku_code === "STAFF_GREY_TSHIRT" ? "selected" : ""
              }>${esc(it.name)}</option>`,
          )
          .join("");
        issueManager =
          `<div class="card">` +
          `<h2>Issue to staff (manager / TL)</h2>` +
          `<p class="muted" style="margin:0 0 8px">Uses each person's kit offer (2+2 / 1+1 / none). Swimming has no grey kit yet.</p>` +
          `<label>Staff</label><select id="mgrStaff"><option value="">Select</option>${staffOpts}</select>` +
          `<div id="mgrKitHint" class="muted" style="margin:6px 0 8px;overflow-wrap:break-word">Select staff to see kit.</div>` +
          `<div class="grid2"><div><label>T-shirt size</label><select id="mgrSize">` +
          ["S", "M", "L", "XL", "XXL"]
            .map(
              (s) =>
                `<option value="${s}"${s === "M" ? " selected" : ""}>${s}</option>`,
            )
            .join("") +
          `</select></div><div><label>Sweat size</label><select id="mgrSizeSweat">` +
          ["S", "M", "L", "XL", "XXL"]
            .map(
              (s) =>
                `<option value="${s}"${s === "M" ? " selected" : ""}>${s}</option>`,
            )
            .join("") +
          `</select></div></div>` +
          `<label>Your typed name (issuer)</label>` +
          `<input id="mgrIssuerAck" type="text" value="${esc(actor.full_name || "")}" />` +
          `<button type="button" class="btn" id="mgrIssueKitBtn">Issue recommended kit</button>` +
          `<hr style="border:0;border-top:1px solid #e6ecf4;margin:14px 0" />` +
          `<p class="muted" style="margin:0 0 8px">Or single-line issue:</p>` +
          `<label>Item</label><select id="mgrItem">${itemOpts}</select>` +
          `<div class="grid2"><div><label>Qty</label><input id="mgrQty" type="number" min="1" max="20" value="2" /></div></div>` +
          `<label>Type</label><select id="mgrType">` +
          `<option value="initial">Initial</option><option value="replacement">Replacement</option>` +
          `<option value="size_change">Size change</option><option value="correction">Correction</option></select>` +
          `<label>Reason</label><input id="mgrReason" type="text" placeholder="Required for lost/damaged replacement" />` +
          `<label style="display:flex;align-items:center;gap:8px;margin-top:10px">` +
          `<input type="checkbox" id="mgrCharge" style="width:auto" /> £5 charge applies (employee lost/damaged)</label>` +
          `<p class="charge-note">Work-duty damage: leave charge unchecked (company replaces).</p>` +
          `<button type="button" class="btn btn--sec" id="mgrIssueBtn">Issue one line</button></div>`;
      }

      const open = issues.filter((i) => i.status === "issued");
      const closed = issues.filter((i) => i.status !== "issued");

      app.innerHTML =
        `<div class="card"><h2>Your allocation</h2>` +
        `<p class="muted" style="margin:0;overflow-wrap:break-word"><strong>${esc(
          (data.kit_offer && data.kit_offer.label) || "Kit",
        )}</strong> — ${esc(
          (data.kit_offer && data.kit_offer.summary) || "See Admin for issue.",
        )}` +
        (data.kit_offer && data.kit_offer.swimming_note
          ? `<br>${esc(data.kit_offer.swimming_note)}`
          : "") +
        `</p></div>` +
        `<div class="card"><h2>Issued to you</h2>` +
        (open.length
          ? open.map(renderIssue).join("")
          : `<p class="muted">No open uniform issues yet. When Admin/TL issues your kit, it will appear here for confirmation.</p>`) +
        `</div>` +
        (closed.length
          ? `<div class="card"><h2>Returned / history</h2>${closed.map(renderIssue).join("")}</div>`
          : "") +
        `<div class="card"><h2>Replacement note</h2>` +
        `<p class="muted" style="margin:0">Lost or damaged by you: £5 per item. Damaged on duty: company replaces at no charge. Ask your Team Leader or Manager to issue a replacement — both of you acknowledge on the record.</p></div>` +
        issueManager;

      app.querySelectorAll("[data-ack]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-ack");
          const input = document.getElementById("ack-" + id);
          const name = String(input && input.value || "").trim();
          if (!name) {
            showMsg("Type your full name to confirm.", "err");
            return;
          }
          btn.disabled = true;
          const res = await edgePost(sb, "uniform-issue", {
            action: "staff_ack",
            issue_id: id,
            staff_ack_name: name,
          });
          btn.disabled = false;
          if (!res.ok) {
            showMsg(res.error || "Could not confirm", "err");
            return;
          }
          showMsg("Receipt confirmed. Thank you.", "ok");
          await refresh(sb);
        });
      });

      const mgrStaff = document.getElementById("mgrStaff");
      const mgrKitHint = document.getElementById("mgrKitHint");
      const mgrIssueKitBtn = document.getElementById("mgrIssueKitBtn");
      function refreshMgrKit() {
        if (!mgrStaff || !mgrKitHint) return;
        const hit = (data.staff_directory || []).find(
          (s) => String(s.id) === String(mgrStaff.value || ""),
        );
        if (!hit) {
          mgrKitHint.textContent = "Select staff to see kit.";
          if (mgrIssueKitBtn) mgrIssueKitBtn.disabled = true;
          return;
        }
        mgrKitHint.textContent = `${hit.kit_label || "—"} — ${hit.kit_summary || "No auto kit"}`;
        if (mgrIssueKitBtn) {
          mgrIssueKitBtn.disabled = !(hit.kit_lines && hit.kit_lines.length);
        }
      }
      if (mgrStaff) {
        mgrStaff.addEventListener("change", refreshMgrKit);
        refreshMgrKit();
      }
      if (mgrIssueKitBtn) {
        mgrIssueKitBtn.addEventListener("click", async () => {
          mgrIssueKitBtn.disabled = true;
          const res = await edgePost(sb, "uniform-issue", {
            action: "issue_recommended_kit",
            staff_profile_id: (document.getElementById("mgrStaff") || {}).value,
            size: (document.getElementById("mgrSize") || {}).value,
            size_sweat: (document.getElementById("mgrSizeSweat") || {}).value,
            issuer_ack_name: (document.getElementById("mgrIssuerAck") || {}).value,
          });
          mgrIssueKitBtn.disabled = false;
          if (!res.ok) {
            showMsg(res.error || "Kit issue failed", "err");
            return;
          }
          showMsg("Recommended kit issued.", "ok");
          await refresh(sb);
        });
      }

      const mgrBtn = document.getElementById("mgrIssueBtn");
      if (mgrBtn) {
        mgrBtn.addEventListener("click", async () => {
          const charge = !!(document.getElementById("mgrCharge") || {}).checked;
          mgrBtn.disabled = true;
          const res = await edgePost(sb, "uniform-issue", {
            staff_profile_id: (document.getElementById("mgrStaff") || {}).value,
            item_id: (document.getElementById("mgrItem") || {}).value,
            size: (document.getElementById("mgrSize") || {}).value,
            qty: Number((document.getElementById("mgrQty") || {}).value || 1),
            issue_type: (document.getElementById("mgrType") || {}).value,
            reason: (document.getElementById("mgrReason") || {}).value,
            charge_applies: charge,
            charge_gbp: charge ? 5 : 0,
            issuer_ack_name: (document.getElementById("mgrIssuerAck") || {}).value,
          });
          mgrBtn.disabled = false;
          if (!res.ok) {
            showMsg(res.error || "Issue failed", "err");
            return;
          }
          showMsg("Issued. Stock updated.", "ok");
          await refresh(sb);
        });
      }
    }

    async function refresh(sb) {
      const mode = "staff";
      const res = await edgePost(sb, "uniform-load", { mode });
      if (!res.ok) {
        document.getElementById("app").innerHTML =
          `<p class="err">Could not load uniform record (${esc(res.error)}). Sign in again from the staff dashboard.</p>`;
        return;
      }
      // Managers need staff directory for issue form — reload admin mode lightly if allowed
      if (res.actor && res.actor.can_issue) {
        const adminRes = await edgePost(sb, "uniform-load", { mode: "admin" });
        if (adminRes.ok) {
          res.staff_directory = adminRes.staff_directory || [];
          res.items = adminRes.items || res.items;
        }
      }
      render(res, sb);
    }

    (async function main() {
      try {
        const sb = await getClient();
        await refresh(sb);
      } catch (e) {
        document.getElementById("app").innerHTML =
          `<p class="err">Sign in required. Open the staff dashboard first, then return here.</p>`;
        console.warn("[uniform]", e);
      }
    })();
  </script>
</body>
</html>
