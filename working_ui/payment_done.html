<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment received — ClubSENsational</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --bg: #f8fafc;
      --card: #ffffff;
      --line: #e2e8f0;
      --ok: #047857;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #dcfce7 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(28rem, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      line-height: 1.25;
      color: var(--ok);
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      overflow-wrap: break-word;
    }
    p + p { margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Thank you — payment received</h1>
    <p id="body">You can close this page. No need to sign in to the parent portal.</p>
    <p>ClubSENsational will confirm the payment on the booking shortly.</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get("cancelled") === "1") {
        document.getElementById("title").textContent = "Payment cancelled";
        document.getElementById("title").style.color = "#9a3412";
        document.getElementById("body").textContent =
          "No charge was made. You can close this page or ask the office for a new link.";
      }
    })();
  </script>
</body>
</html>
