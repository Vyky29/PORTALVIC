    { id: "raul-remanente-mananas-sep24-nov25", col: "cierre", title: "Raul, remanente mananas", href: "/portal/finance/canvas/raul-remanente-mananas-sep24-nov25.html" },
    { id: "roberto-cobrado-sep25-jul26", col: "cierre", title: "Roberto, cobrado sep 25 a jul 26", href: "/portal/finance/canvas/roberto-cobrado-sep25-jul26.html" },
    { id: "roberto-may-4-and-18-weeks", col: "cierre", title: "Roberto, semanas del 4 y 18 may", href: "/portal/finance/canvas/roberto-may-4-and-18-weeks.html" },
    { id: "summer-receipts-vs-portal", col: "cierre", title: "Summer, recibos contra el portal", href: "/portal/finance/canvas/summer-receipts-vs-portal.html" },
    { id: "summer-term-clients", col: "cierre", title: "Summer Term, participantes", href: "/portal/finance/canvas/summer-term-clients.html" },
    { id: "sun6-sep-beneficio", col: "cierre", title: "Beneficio, domingo 6 sep", href: "/portal/finance/canvas/sun6-sep-beneficio.html" },
    { id: "taxis-ikram-joelle-2026", col: "uso", title: "Taxis Ikram y Joelle", href: "/portal/finance/taxis-ikram-joelle.html", hint: "En uso. Pactado NHS contra lo cobrado." },
    { id: "tide-bank-miriam-oct24-jan26", col: "cierre", title: "Tide, listas Miriam", href: "/portal/finance/canvas/tide-bank-miriam-oct24-jan26.html" },
    { id: "tide-card-spend-vjr-sep-jul", col: "cierre", title: "Tide, gastos por tarjeta", href: "/portal/finance/canvas/tide-card-spend-vjr-sep-jul.html" },
    { id: "tide-income-spend-jul22-sep24", col: "cierre", title: "Tide, income y gasto", href: "/portal/finance/canvas/tide-income-spend-jul22-sep24.html" },
    { id: "tide-sep-jul-2026", col: "cierre", title: "Tide, sep 25 a jul 26", href: "/portal/finance/canvas/tide-sep-jul-2026.html" },
    { id: "tide-tarjeta-empresa", col: "cierre", title: "Tarjeta de empresa", href: "/portal/finance/canvas/tide-tarjeta-empresa.html" },
    { id: "vr-mananas-empresa-sep24", col: "cierre", title: "V y R mananas, y el resto", href: "/portal/finance/canvas/vr-mananas-empresa-sep24.html" }
  ];
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
  }
  function save(state) {
    localStorage.setItem(KEY, JSON.stringify(state));
  }
  function colOf(d, state) {
    var row = state[d.id];
    return row && (row.col === "uso" || row.col === "cierre") ? row.col : d.col;
  }
  function noteOf(d, state) {
    var row = state[d.id];
    return row && row.note ? row.note : "";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function card(d, state) {
    var col = colOf(d, state);
    var note = noteOf(d, state);
    return '<article class="rev-card" data-id="' + esc(d.id) + '">' +
      "<b>" + esc(d.title) + "</b>" +
      (d.hint ? '<span class="hint">' + esc(d.hint) + "</span>" : "") +
      '<div class="rev-actions">' +
      '<a href="' + esc(d.href) + '">Ver</a>' +
      '<button type="button" data-set="uso"' + (col === "uso" ? ' class="is-on"' : "") + ">En uso</button>" +
      '<button type="button" data-set="cierre"' + (col === "cierre" ? ' class="is-on"' : "") + ">Cerrado</button>" +
      "</div>" +
      '<textarea placeholder="Nota para corregir" data-note="1">' + esc(note) + "</textarea>" +
      "</article>";
  }
  function render() {
    var state = load();
    var uso = [];
    var cierre = [];
    DOCS.forEach(function (d) {
      (colOf(d, state) === "cierre" ? cierre : uso).push(d);
    });
    document.getElementById("colUso").innerHTML = "<h2>En uso, " + uso.length + "</h2>" + uso.map(function (d) { return card(d, state); }).join("");
    document.getElementById("colCierre").innerHTML = "<h2>Cerrados, " + cierre.length + "</h2>" + cierre.map(function (d) { return card(d, state); }).join("");
  }
  document.querySelector(".rev").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-set]");
    if (!btn) return;
    var cardEl = btn.closest("[data-id]");
    var id = cardEl.getAttribute("data-id");
    var state = load();
    var prev = state[id] || {};
    state[id] = { col: btn.getAttribute("data-set"), note: prev.note || "" };
    var area = cardEl.querySelector("textarea");
    if (area) state[id].note = area.value;
    save(state);
    render();
  });
  document.querySelector(".rev").addEventListener("input", function (ev) {
    var area = ev.target.closest("textarea");
    if (!area) return;
    var id = area.closest("[data-id]").getAttribute("data-id");
    var doc = null;
    DOCS.forEach(function (d) { if (d.id === id) doc = d; });
    var state = load();
    var prev = state[id] || {};
    state[id] = { col: prev.col || (doc ? doc.col : "uso"), note: area.value };
    save(state);
  });
  document.getElementById("revCopy").addEventListener("click", function () {
    var state = load();
    var lines = [];
    DOCS.forEach(function (d) {
      var col = colOf(d, state);
      var note = noteOf(d, state).trim();
      if (col === d.col && !note) return;
      lines.push(d.title + " | " + (col === "cierre" ? "cerrado" : "en uso") + (note ? " | " + note : ""));
    });
    var text = lines.length ? lines.join("\n") : "Sin cambios ni notas.";
    var msg = document.getElementById("revCopyMsg");
    function done() { msg.textContent = "Copiado. Pegalo en el chat."; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { msg.textContent = text; });
    } else {
      msg.textContent = text;
    }
  });
  render();
})();
</script>
