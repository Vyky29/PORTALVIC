name: Feedback ring

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run the feedback ring checks
        run: deno run -A database/local-vault/smoke-feedback-2030-shared-20260909.ts

  publish:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish the ring only after the checks pass
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          ring=0
          digest=0
          if printf '%s\n' "$changed" | grep -Eq 'supabase/functions/portal-feedback-2030-whatsapp/|supabase/functions/_shared/portal_feedback_2030_match\.ts|supabase/functions/_shared/portal_capacity_chain_standing_occupants\.json|supabase/functions/_shared/portal_parent_messaging\.ts|supabase/functions/_shared/portal_webpush_util\.ts'; then
            ring=1
          fi
          if printf '%s\n' "$changed" | grep -Eq 'supabase/functions/portal-push-feedback-9pm-digest/|supabase/functions/_shared/portal_feedback_digest_match\.ts'; then
            digest=1
          fi
          if [ "$ring" = 0 ] && [ "$digest" = 0 ]; then
            echo "Feedback code unchanged. Nothing to publish."
            exit 0
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing. The ring was not published."
            exit 1
          fi
          if [ "$ring" = 1 ]; then
            npx supabase functions deploy portal-feedback-2030-whatsapp --project-ref cklpnwhlqsulpmkipmqb --no-verify-jwt
          fi
          if [ "$digest" = 1 ]; then
            npx supabase functions deploy portal-push-feedback-9pm-digest --project-ref cklpnwhlqsulpmkipmqb --no-verify-jwt
          fi
